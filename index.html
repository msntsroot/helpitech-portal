<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelpiTech Portal — Clientes, Métricas e Oportunidades (homologação)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:#00696b;--on-p:#fff;--pc:#9cf1f2;--on-pc:#002020;
  --s:#4a6363;--sc:#cce8e8;--on-sc:#051f1f;
  --err:#ba1a1a;--on-err:#fff;--errc:#ffdad6;--warn:#8a5100;--warnc:#ffddb8;--ok:#176b3a;--okc:#b6f1c7;
  --bg:#f4fafa;--sf:#f4fafa;--sf1:#eaf0f0;--sf2:#e4eaea;--sf3:#dee4e4;--on:#161d1d;--onv:#3f4948;--ol:#6f7979;--olv:#bec8c8;
  --e1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);--e2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);
  --c1:#00696b;--c2:#8a5100;--c3:#6750a4;--c4:#ba1a1a;
  font-family:"Noto Sans",sans-serif;
}
:root[data-theme=dark]{
  --p:#4cdadc;--on-p:#003737;--pc:#004f50;--on-pc:#9cf1f2;--s:#b0cccc;--sc:#324b4b;--on-sc:#cce8e8;
  --err:#ffb4ab;--on-err:#690005;--errc:#93000a;--warn:#ffb867;--warnc:#693c00;--ok:#9adaad;--okc:#00522a;
  --bg:#0e1514;--sf:#0e1514;--sf1:#161d1d;--sf2:#1a2121;--sf3:#252b2b;--on:#dde4e3;--onv:#bec8c8;--ol:#899392;--olv:#3f4948;
  --c1:#4cdadc;--c2:#ffb867;--c3:#cfbcff;--c4:#ffb4ab;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans",sans-serif;background:var(--bg);color:var(--on);font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px;top:8px;background:var(--p);color:var(--on-p);padding:8px 16px;border-radius:8px;z-index:100}.skip:focus{left:8px}
/* app bar */
header.bar{position:fixed;top:0;left:0;right:0;height:64px;background:var(--sf2);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20}
header.bar h1{font-size:20px;font-weight:500;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer}
.ib:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}
/* drawer */
nav.drawer{position:fixed;top:64px;bottom:0;left:0;width:280px;background:var(--sf1);padding:12px;overflow:auto;z-index:15;transform:translateX(-100%);transition:transform .2s}
nav.drawer.open{transform:none;box-shadow:var(--e2)}
.scrim{position:fixed;inset:64px 0 0 0;background:rgba(0,0,0,.4);z-index:14;display:none}.scrim.on{display:block}
nav.drawer a{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:24px;color:var(--onv);text-decoration:none;font-weight:500;cursor:pointer}
nav.drawer a:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}
nav.drawer a[aria-current=page]{background:var(--sc);color:var(--on-sc)}
main{padding:80px 16px 96px;max-width:1280px;margin:0 auto}
@media(min-width:960px){nav.drawer{transform:none;box-shadow:none}.scrim{display:none!important}main{margin-left:296px;margin-right:16px;max-width:none}.menu-btn{display:none}}
h2.pt{font-size:28px;font-weight:400;margin:8px 0 16px}
h3{font-size:16px;font-weight:600;margin:0 0 8px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--sf1);border-radius:12px;padding:16px;box-shadow:var(--e1);min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--olv);background:transparent}
.kpi .v{font-size:32px;font-weight:500;line-height:1.2}.kpi .l{color:var(--onv);font-size:13px}.kpi .s{font-size:12px;color:var(--onv)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.muted{color:var(--onv)}.small{font-size:12px}
/* buttons */
.btn{height:40px;border-radius:20px;border:0;padding:0 20px;background:var(--p);color:var(--on-p);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.1);box-shadow:var(--e1)}
.btn.tonal{background:var(--sc);color:var(--on-sc)}.btn.out{background:transparent;color:var(--p);border:1px solid var(--ol)}.btn.text{background:transparent;color:var(--p);padding:0 12px}
.btn.err{background:var(--err);color:var(--on-err)}.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg.i{width:18px;height:18px}
.fab{position:fixed;right:24px;bottom:24px;z-index:12;height:56px;border-radius:16px;padding:0 20px;box-shadow:var(--e2)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--ol);font-size:12px;font-weight:500;background:transparent;white-space:nowrap}
.chip.ok{background:var(--okc);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warnc);color:var(--warn);border-color:transparent}
.chip.err{background:var(--errc);color:var(--err);border-color:transparent}.chip.info{background:var(--sc);color:var(--on-sc);border-color:transparent}
button.chip{cursor:pointer}button.chip[aria-pressed=true]{background:var(--sc);color:var(--on-sc)}
/* fields */
.tf{position:relative;display:block}
.tf input,.tf select,.tf textarea{width:100%;min-height:48px;padding:20px 12px 6px;background:var(--sf2);border:0;border-bottom:1px solid var(--ol);border-radius:4px 4px 0 0}
.tf textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.tf span{position:absolute;left:12px;top:4px;font-size:11px;color:var(--onv);pointer-events:none}
.tf input:focus,.tf select:focus,.tf textarea:focus{outline:none;border-bottom:2px solid var(--p)}
.tf.err input,.tf.err select{border-bottom:2px solid var(--err)}
.chk{display:flex;gap:8px;align-items:center;min-height:48px}.chk input{width:20px;height:20px;accent-color:var(--p)}
/* table */
.tw{overflow:auto;border-radius:12px;border:1px solid var(--olv);background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--olv);vertical-align:middle}
th{background:var(--sf2);font-weight:600;font-size:13px;white-space:nowrap;position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}th button:focus-visible{outline:3px solid var(--p)}
td.n,th.n{text-align:right}tr:hover td{background:color-mix(in srgb,var(--on) 4%,transparent)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.toolbar .tf{min-width:180px}
/* dialog + snackbar */
dialog{border:0;border-radius:28px;background:var(--sf3);color:var(--on);padding:24px;max-width:min(720px,94vw);width:100%;box-shadow:var(--e2)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
dialog .full{grid-column:1/-1}.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
dialog .body{max-height:62vh;overflow:auto}
#snack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--on);color:var(--bg);padding:12px 16px;border-radius:8px;z-index:50;display:none;box-shadow:var(--e2);max-width:90vw}
#snack.on{display:block}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:360px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px}
.m{max-width:85%;padding:10px 14px;border-radius:16px;white-space:normal}.m.u{align-self:flex-end;background:var(--pc);color:var(--on-pc)}.m.a{align-self:flex-start;background:var(--sf2)}
.m .tw{margin:8px 0}.m table{min-width:0;font-size:13px}.m th,.m td{padding:6px 10px}.m .mt{margin-top:6px}
.m ul{margin:4px 0;padding-left:18px}
.cform{display:flex;gap:8px;margin-top:8px}.cform .tf{flex:1}
/* charts */
svg.ch{width:100%;height:auto;display:block}svg.ch text{fill:var(--onv);font-size:11px;font-family:inherit}
.legend{display:flex;gap:12px;font-size:12px;color:var(--onv);margin-top:4px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.prog{height:8px;border-radius:4px;background:var(--sf3);overflow:hidden;min-width:80px}.prog>div{height:100%;background:var(--p)}.prog.warn>div{background:var(--warn)}.prog.err>div{background:var(--err)}
pre.code{background:var(--sf2);padding:12px;border-radius:8px;overflow:auto;font-size:12px;max-height:360px}
.banner{background:var(--warnc);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--olv);margin-bottom:12px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:10px 16px;font-weight:500;color:var(--onv);border-bottom:3px solid transparent}.tabs button[aria-selected=true]{color:var(--p);border-color:var(--p)}.tabs button:focus-visible{outline:3px solid var(--p)}
ul.clean{list-style:none;padding:0;margin:0}ul.clean li{padding:8px 0;border-bottom:1px solid var(--olv)}
@media(max-width:600px){h2.pt{font-size:22px}.kpi .v{font-size:26px}}
</style>
</head>
<body>
<a class="skip" href="#main">Ir para o conteúdo</a>
<header class="bar">
  <button class="ib menu-btn" id="menuBtn" aria-label="Abrir menu de navegação"></button>
  <h1 id="appTitle">HelpiTech Portal</h1>
  <label class="tf" style="min-width:170px"><span>Perfil simulado</span><select id="roleSel"></select></label>
  <label class="tf" id="csWrap" style="min-width:150px"><span>Analista de CS</span><select id="csSel"></select></label>
  <button class="chip" id="maskBtn" aria-pressed="true" title="Mascarar dados pessoais (LGPD)">LGPD: mascarado</button>
  <button class="ib" id="themeBtn" aria-label="Alternar tema claro/escuro"></button>
</header>
<nav class="drawer" id="drawer" aria-label="Navegação principal"></nav>
<div class="scrim" id="scrim"></div>
<main id="main" tabindex="-1"></main>
<dialog id="dlg" aria-modal="true"></dialog>
<div id="snack" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   0. UTILITÁRIOS (funções puras)
   ============================================================ */
const U = {
  esc: s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])),
  norm: s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""),
  pad: n => String(n).padStart(2, "0"),
  iso(d) { return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}`; },
  today() { return U.iso(new Date()); },
  isDate(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return false; const d = new Date(s + "T00:00:00"); return !isNaN(d) && U.iso(d) === s; },
  d(s) { return new Date(String(s).slice(0, 10) + "T00:00:00"); },
  addDays(s, n) { const d = U.d(s); d.setDate(d.getDate() + n); return U.iso(d); },
  days(a, b) { return Math.round((U.d(b) - U.d(a)) / 864e5); },
  fmtDate: s => s ? String(s).slice(0, 10).split("-").reverse().join("/") : "—",
  money: n => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }),
  num: (n, d = 1) => (Number(n) || 0).toLocaleString("pt-BR", { maximumFractionDigits: d }),
  parseMoney(v) {
    if (typeof v === "number") return v;
    if (typeof v !== "string") return NaN;
    let s = v.replace(/R\$|\s/g, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
  },
  deepEq: (a, b) => JSON.stringify(a) === JSON.stringify(b),
  sum: (a, f) => a.reduce((t, x) => t + (f ? f(x) : x), 0),
  group(arr, f) { const m = new Map(); for (const x of arr) { const k = f(x); (m.get(k) || m.set(k, []).get(k)).push(x); } return m; },
  csv(rows, cols) {
    const q = v => { const s = String(v ?? ""); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return "\ufeff" + [cols.map(c => q(c.label)), ...rows.map(r => cols.map(c => q(c.val(r))))].map(r => r.join(";")).join("\r\n");
  },
  download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: type || "application/json" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
};
const PII = {
  doc: s => { const d = String(s || "").replace(/\D/g, ""); return d.length === 14 ? `${d.slice(0, 2)}.***.***/****-${d.slice(12)}` : d.length === 11 ? `***.***.${d.slice(6, 9)}-**` : s ? "***" : "—"; },
  email: s => { const m = String(s || "").match(/^(.)[^@]*(@.+)$/); return m ? `${m[1]}***${m[2]}` : "—"; },
  phone: s => { const d = String(s || "").replace(/\D/g, ""); return d.length >= 8 ? `(**) ****-${d.slice(-4)}` : "—"; },
  scrub: t => String(t || "").replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, "[e-mail]").replace(/\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/g, "[CPF]").replace(/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/g, "[CNPJ]").replace(/\(?\b\d{2}\)?\s?9?\d{4}-?\d{4}\b/g, "[tel]")
};

/* ============================================================
   1. SCHEMAS (JSON Schema) + exemplos
   ============================================================ */
const SCHEMAS = {
  customers: {
    $schema: "http://json-schema.org/draft-07/schema#", title: "Cliente", type: "object", required: ["external_id", "name", "status"],
    properties: {
      external_id: { type: ["string", "integer"], description: "ID do cliente no sistema de origem (chave de upsert)" },
      name: { type: "string", minLength: 2 }, trading_name: { type: "string" },
      document: { type: "string", description: "CNPJ ou CPF (com ou sem pontuação)" }, ie: { type: "string" },
      status: { enum: ["ativo", "inativo", "inadimplente"] },
      segment: { type: "string", description: "Ex.: Indústria, Varejo, Saúde" }, size: { enum: ["micro", "pequeno", "medio", "grande"] },
      cs_owner: { type: "string", description: "Responsável de CS (define a visibilidade do perfil CS)" },
      city: { type: "string" }, state: { type: "string", pattern: "^[A-Z]{2}$" }, amount_tickets: { type: "integer", minimum: 0 },
      contacts: { type: "array", items: { type: "object", required: ["name"], properties: { name: { type: "string" }, email: { type: "string", format: "email" }, phone: { type: "string" }, role: { type: "string" } } } }
    }
  },
  services: {
    $schema: "http://json-schema.org/draft-07/schema#", title: "Serviço do catálogo", type: "object", required: ["external_id", "name"],
    properties: {
      external_id: { type: ["string", "integer"] }, name: { type: "string", minLength: 2 }, description: { type: "string" },
      price: { type: "number", minimum: 0, description: "Preço por unidade de medida (R$)" }, unit: { type: "string", description: "hora, mês, ano, projeto…" },
      est_units_year: { type: "number", minimum: 0, description: "Unidades típicas por ano (estimativa de receita)" },
      category: { type: "string" }, target_segments: { type: "array", items: { type: "string" }, description: "Vazio = relevante para todos" }
    }
  },
  contracts: {
    $schema: "http://json-schema.org/draft-07/schema#", title: "Contrato", type: "object", required: ["external_id", "customer_id", "service_id", "value", "start_date", "end_date"],
    properties: {
      external_id: { type: ["string", "integer"] }, customer_id: { type: ["string", "integer"] }, service_id: { type: ["string", "integer"] },
      value: { type: "number", minimum: 0, description: "Valor em R$ (aceita \"4.000,00\" no formato legado)" },
      hours: { type: "number", minimum: 0, description: "Franquia de horas da vigência" },
      start_date: { type: "string", format: "date" }, end_date: { type: "string", format: "date" },
      auto_renew: { type: "boolean" }, billing_day: { type: "integer", minimum: 1, maximum: 31 }, description: { type: "string" },
      status: { enum: ["vigente", "encerrado", "cancelado"] }, reason_disable: { type: ["string", "null"] }
    }
  },
  usage_events: {
    $schema: "http://json-schema.org/draft-07/schema#", title: "Evento de consumo", type: "object", required: ["external_id", "customer_id", "date", "quantity"],
    properties: {
      external_id: { type: ["string", "integer"] }, customer_id: { type: ["string", "integer"] }, date: { type: "string", format: "date" },
      quantity: { type: "number", minimum: 0, description: "Horas consumidas" }, service_id: { type: ["string", "integer"], description: "Opcional: se omitido, atribui ao contrato vigente" },
      description: { type: "string" }
    }
  },
  emails: {
    $schema: "http://json-schema.org/draft-07/schema#", title: "E-mail do CS (anonimizado)", type: "object", required: ["external_id", "customer_id", "thread_id", "date", "from", "subject"],
    description: "Informe body OU summary. O corpo NÃO é armazenado: só resumo, sinais e referência.",
    properties: {
      external_id: { type: ["string", "integer"], description: "ID/Message-ID do e-mail (referência)" }, customer_id: { type: ["string", "integer"] }, thread_id: { type: "string" },
      date: { type: "string", format: "date" }, from: { type: "string" }, to: { type: "string" }, subject: { type: "string" },
      body: { type: "string" }, summary: { type: "string" }, internal: { type: "boolean", description: "true = mensagem interna (ignorada)" }
    }
  }
};
const ENTITY_LABEL = { customers: "Clientes", services: "Serviços", contracts: "Contratos", usage_events: "Consumo", emails: "E-mails" };
const IMPORT_ORDER = ["services", "customers", "contracts", "usage_events", "emails"];
const EXAMPLES = {
  customers: [{ external_id: "C-1001", name: "Exemplo Indústria Ltda", trading_name: "Exemplo", document: "11.222.333/0001-81", status: "ativo", segment: "Indústria", size: "medio", cs_owner: "Ana Souza", city: "São Paulo", state: "SP", amount_tickets: 12, contacts: [{ name: "Maria Contato", email: "maria@exemplo.com.br", phone: "11999990000", role: "TI" }] }],
  services: [{ external_id: 4, name: "NOC", description: "Monitoramento 24x7 de servidores e rede", price: 1800, unit: "mês", est_units_year: 12, category: "Operação" }],
  contracts: [{ external_id: "K-2001", customer_id: "C-1001", service_id: 1, value: 3500, hours: 100, start_date: "2026-04-01", end_date: "2027-03-28", auto_renew: true, billing_day: 1, description: "Contrato anual de suporte", status: "vigente" }],
  usage_events: [{ external_id: "U-1", customer_id: "C-1001", date: "2026-10-20", quantity: 3.5, service_id: 1, description: "Chamado #4521 — ajuste de VPN" }],
  emails: [{ external_id: "msg-0001", customer_id: "C-1001", thread_id: "T-77", date: "2026-10-22", from: "maria@exemplo.com.br", subject: "Backup", body: "Tivemos queda de energia e perdemos arquivos. Precisamos de uma rotina de backup até dezembro.", internal: false }]
};
/* ============================================================
   2. VALIDAÇÃO (puro) — mini JSON Schema + regras de negócio
   ============================================================ */
const V = {
  typeOk(v, t) { return ({ string: typeof v === "string", number: typeof v === "number" && isFinite(v), integer: Number.isInteger(v), boolean: typeof v === "boolean", array: Array.isArray(v), object: v && typeof v === "object" && !Array.isArray(v), null: v === null })[t]; },
  validate(v, sc, path = "") {
    const e = [];
    if (sc.type) { const ts = [].concat(sc.type); if (!ts.some(t => V.typeOk(v, t))) return [`${path || "registro"}: tipo esperado ${ts.join("|")}`]; }
    if (sc.enum && !sc.enum.includes(v)) e.push(`${path}: valor deve ser um de ${sc.enum.join(", ")}`);

/* Métricas */
const MS = { kind: "30", from: "", to: "", by: "customer" };
Pages.metrics = el => {
  const today = Ctx.today(), usage = Acc.scoped("usage_events");
  if (!usage.length) { el.innerHTML = `<h2 class="pt">Métricas de uso</h2>` + empty(); return bindEmpty(); }
  const rng = M.range(MS.kind, today, { from: MS.from, to: MS.to }), prev = M.previous(rng), cidx = Ctx.contractsIdx();
  const svcKey = e => M.serviceOf(e, cidx.get(e.customer_id));
  const cur = M.groupSum(usage, rng, e => MS.by === "customer" ? e.customer_id : svcKey(e)), pv = M.groupSum(usage, prev, e => MS.by === "customer" ? e.customer_id : svcKey(e));
  const keys = [...new Set([...cur.keys(), ...pv.keys()])];
  const fr = id => { const cs = (cidx.get(id) || []).filter(c => M.isActive(c, today) && c.hours > 0), days = U.days(rng.start, rng.end) + 1; return U.sum(cs, c => c.hours / (U.days(c.start_date, c.end_date) + 1) * days); };

const Chat = {
  providers: {},
  period(n) { const t = Ctx.today(); if (/semana/.test(n)) return { r: M.range("7", t), l: "últimos 7 dias" }; if (/quinzen/.test(n)) return { r: M.range("15", t), l: "últimos 15 dias" }; const d = n.match(/(\d+)\s*dias/); if (d) return { r: { start: U.addDays(t, -(+d[1] - 1)), end: t }, l: `últimos ${d[1]} dias` }; if (/mes/.test(n)) return { r: M.range("30", t), l: "últimos 30 dias" }; return { r: M.range("30", t), l: "últimos 30 dias (padrão)" }; },
  findCustomer(n) {
    const list = Acc.customers().map(c => ({ c, names: [c.trading_name, c.name].filter(Boolean).map(U.norm) }));
    const hit = list.filter(x => x.names.some(nm => n.includes(nm))).sort((a, b) => Math.max(...b.names.map(s => s.length)) - Math.max(...a.names.map(s => s.length)))[0];

  },

  list: (items, f) => `<ul>${items.map(i => `<li>${f(i)}</li>`).join("")}</ul>`
};

      return l.length ? `Encontrei <b>${l.length}</b> oportunidade(s)${cust ? " para " + U.esc(Ctx.cname(cust.external_id)) : ""}${lvl ? " de score " + lvl : ""}:` + Chat.list(l.slice(0, 8), o => `<b>${U.esc(o.customer)}</b> → ${U.esc(o.service)} (${o.score}) — ${U.esc(o.evidence[0].text.slice(0, 100))}`) : `Sem oportunidades identificadas${cust ? " para " + U.esc(Ctx.cname(cust.external_id)) : ""} com esses critérios.`;

      let l = cons.filter(c => M.isActive(c, today)).map(c => ({ c, d: U.days(today, c.end_date) })); if (mes) l = l.filter(x => x.c.end_date.slice(0, 7) === today.slice(0, 7) && x.d >= 0); else l = l.filter(x => x.d <= d && x.d >= 0); if (cust) l = l.filter(x => x.c.customer_id === cust.external_id); l.sort((a, b) => a.d - b.d);

    if (/(alerta|excesso|franquia|churn|baixo uso)/.test(n)) {
      const l = cons.filter(c => M.isActive(c, today)).map(c => ({ c, s: M.contractStatus(c, Ctx.usageIdx().get(c.customer_id) || [], today) })).filter(x => x.s.flag && x.s.flag !== "atencao" && (!cust || x.c.customer_id === cust.external_id));

    }

  <p class="small muted">${AI.ready() ? `Respostas geradas por IA (<b>${U.esc(Chat.providers.llm.name)}</b>, deployment <code>${U.esc(AI.get().deployment)}</code>). As perguntas, o histórico da conversa e os resultados das consultas (sem CPF/CNPJ/contatos, respeitando seu perfil) são enviados ao endpoint configurado.` : `Respostas geradas por regras sobre os dados locais (${U.esc(Chat.providers.rules.name)}). Quando não há dado, o chat informa. Para usar IA, configure o <b>Microsoft Foundry</b> em Configurações.`}</p>`;
  const draw = () => { const box = $("#msgs"); if (!box) return; box.innerHTML = ChatLog.length ? ChatLog.map((m, i) => `<div class="m ${m.r}">${m.r === "u" ? U.esc(m.t) : m.t}${m.tools?.length ? `<div class="small muted mt">🔧 Dados consultados: ${Chat.toolsLabel(m.tools)}</div>` : ""}${m.raw && m.tools?.length ? `<button class="btn text sm" type="button" data-dl="${i}">${ic("download")} Baixar .md</button>` : ""}</div>`).join("") : `<div class="m a">${AI.ready() ? "Olá! Sou o assistente de IA do HelpiTech Portal. Posso consultar clientes, gerar relatórios de contratos e comparar clientes com métricas. Como posso ajudar?" : "Olá! Posso responder sobre clientes, contratos, consumo e oportunidades — somente com base nos dados importados."}</div>`; box.scrollTop = 1e9; $$("[data-dl]", box).forEach(b => b.onclick = () => { const m = ChatLog[+b.dataset.dl]; DB.audit("exportar", "resposta do chat (.md)"); DB.save(); U.download(`helpitech-chat-${U.today()}.md`, m.raw, "text/markdown"); }); };
  if ($("#cbtn")) $("#cbtn").disabled = Chat.busy;
  const ask = async q => {
    if (!q.trim() || Chat.busy) return;
    const llm = Chat.providers.llm.answer, history = ChatLog.filter(m => !m.pending && !m.err);
    ChatLog.push({ r: "u", t: q });
    if (!llm) { let a; try { a = Chat.providers.rules.answer(q); } catch (e) { a = "Erro ao processar a consulta."; } ChatLog.push({ r: "a", t: a }); DB.audit("chat", q.slice(0, 120)); DB.save(); draw(); return; }
    Chat.busy = true; $("#cbtn").disabled = true;
    const pend = { r: "a", t: "<i class=\"muted\">Pensando…</i>", pending: true }; ChatLog.push(pend); draw();
    try { const a = await llm.call(Chat.providers.llm, q, history, used => { pend.t = `<i class="muted">Consultando dados: ${Chat.toolsLabel(used)}…</i>`; draw(); }); Object.assign(pend, { t: a.html, raw: a.raw, tools: a.tools, pending: false }); }
    catch (e) { Object.assign(pend, { t: "Erro ao consultar a IA: " + U.esc(e.message || String(e)) + (e instanceof TypeError ? " (verifique endpoint, rede e CORS)" : ""), pending: false, err: true }); }
    Chat.busy = false; if ($("#cbtn")) $("#cbtn").disabled = false;
    DB.audit("chat-ia", q.slice(0, 120)); DB.save(); draw();
  };
  $("#cf").onsubmit = e => { e.preventDefault(); ask($("#cq").value); $("#cq").value = ""; }; $$("[data-s]").forEach(b => b.onclick = () => ask(b.dataset.s)); draw();
};

Pages.docs = el => {
  const ent = Object.keys(SCHEMAS);
  el.innerHTML = `<h2 class="pt">Documentação</h2><div class="tabs" role="tablist">${["Como usar", "Schemas e exemplos", "Sinais e pontuação", "Limitações e evolução"].map((t, i) => `<button role="tab" aria-selected="${i === 0}" data-tab="${i}">${t}</button>`).join("")}</div>
  <div data-p="0" class="card"><h3>Como usar</h3><ol><li>Na primeira visita os <b>dados fictícios (mock)</b> são carregados automaticamente; para recarregá-los, use <b>Configurações</b>.</li><li>Navegue por Clientes, Contratos, Catálogo, Métricas e Oportunidades; o Chat responde apenas com base nos dados carregados.</li><li>Os formatos de entrada (JSON Schema e exemplos) estão na aba <b>Schemas e exemplos</b> e na pasta <code>schemas/</code> do repositório.</li></ol>
  <p><b>LGPD:</b> dados ficam somente neste navegador (localStorage). Documentos e contatos são mascarados por padrão; o corpo dos e-mails <b>não é armazenado</b> — apenas resumo (sem e-mails/CPF/CNPJ/telefones), sinais e referência. Ações são registradas em Auditoria.</p>
  <p><b>Perfis:</b> Admin (tudo) · Comercial (edita cadastros e vê oportunidades) · Suporte (somente leitura, sem valores/oportunidades, sempre mascarado) · CS (vê apenas clientes em que <code>cs_owner</code> = seu nome; importa consumo e e-mails).</p></div>
  <div data-p="1" class="card" hidden><div class="row"><label class="tf"><span>Entidade</span><select id="se">${ent.map(e => `<option value="${e}">${ENTITY_LABEL[e]}</option>`).join("")}</select></label><button class="btn out sm" id="dlS">${ic("download")} Baixar schema</button><button class="btn out sm" id="dlE">${ic("download")} Baixar exemplo</button><button class="btn out sm" id="dlO">${ic("download")} Exemplo de saída de oportunidades</button></div><h3 style="margin-top:12px">JSON Schema</h3><pre class="code" id="sp"></pre><h3>Exemplo</h3><pre class="code" id="ep"></pre></div>
  <div data-p="2" class="card" hidden><h3>Dicionário de sinais → serviço (editável em Configurações)</h3><div class="tw"><table><thead><tr><th>Regra</th><th>Serviço</th><th>Tipo</th><th>Termos</th></tr></thead><tbody>${Ctx.dict().rules.map(r => `<tr><td>${U.esc(r.key)}</td><td>${U.esc(Ctx.sname(String(r.service_id)))}</td><td>${U.esc(r.kind)}</td><td class="small">${r.terms.map(U.esc).join(", ")}</td></tr>`).join("")}</tbody></table></div>
  <h3 style="margin-top:16px">Pontuação (0–100)</h3><ul><li><b>Evidência (0–30):</b> 10 por evidência distinta + bônus de recência (≤7 dias: +6; ≤15: +3).</li><li><b>Urgência (0–25):</b> e-mail: prazo/urgência +12, reclamação +6, concorrente +7; contrato: vencimento ≤7d 25, ≤15d 20, ≤30d 14, ≤60d 6; franquia: &gt;100% 25, ≥80% 12.</li><li><b>Aderência (0–25):</b> serviço ainda não contratado 25; upsell em serviço contratado 12.</li><li><b>Receita (0–20):</b> preço × unidades/ano do catálogo, proporcional a R$ 50 mil.</li><li><b>Nível:</b> Alta ≥70 · Média ≥45 · Baixa &lt;45.</li></ul>
  <h3>Origens de oportunidade</h3><p><b>email</b> (sinal no e-mail → serviço), <b>renovacao</b> (vence ≤60 dias sem renovação automática), <b>franquia</b> (consumo ≥80%), <b>semcontrato</b> (≥20 chamados sem contrato vigente).</p>
  <p>Guardrails: sem evidência não há oportunidade; e-mails internos/automáticos são ignorados; descartadas/perdidas só reaparecem com <i>nova evidência</i> posterior; nada é enviado nem alterado automaticamente.</p></div>
  <div data-p="3" class="card" hidden><h3>Limitações desta fase</h3><ul><li>Persistência em localStorage (~5 MB): suporta alguns milhares de registros; consumo/e-mails grandes exigem IndexedDB/backend.</li><li>Sem API, sem e-mail direto, perfis simulados (não é segurança real).</li><li>Análise por palavras-chave (sem compreensão semântica); catálogo de exemplo é fictício.</li><li>Franquia de horas é por vigência do contrato; sem rateio entre contratos simultâneos do mesmo cliente.</li></ul>
  <h3>Plano de evolução</h3><ol><li><b>Backend + API REST</b> (Node/.NET + PostgreSQL): mesmas entidades/IDs externos; endpoints <code>/customers, /contracts, /services, /usage-events, /emails, /opportunities</code>; módulos <code>DB</code>, <code>Importer</code>, <code>V</code>, <code>M</code>, <code>Opp</code> migram quase sem mudança.</li><li><b>Webhooks e sincronização</b> com o helpdesk (chamados/horas) substituindo a importação manual.</li><li><b>Autenticação real</b> (OIDC/SSO), RBAC no servidor e auditoria imutável.</li><li><b>Conectores de e-mail</b> (Microsoft Graph/Gmail via OAuth), com minimização e retenção configurável.</li><li><b>LLM</b>: implementar <code>Chat.providers.llm</code> e um extrator de sinais com saída JSON validada pelos schemas, sempre citando evidências e mantendo human-in-the-loop.</li></ol></div>`;
  $$("[data-tab]").forEach(b => b.onclick = () => { $$("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b)); $$("[data-p]").forEach(p => p.hidden = p.dataset.p !== b.dataset.tab); });
  const upd = () => { const e = $("#se").value; $("#sp").textContent = JSON.stringify(SCHEMAS[e], null, 2); $("#ep").textContent = JSON.stringify({ [e]: EXAMPLES[e] }, null, 2); }; $("#se").onchange = upd; upd();
  $("#dlS").onclick = () => U.download(`schema-${$("#se").value}.json`, JSON.stringify(SCHEMAS[$("#se").value], null, 2));
  $("#dlE").onclick = () => U.download(`exemplo-${$("#se").value}.json`, JSON.stringify({ [$("#se").value]: EXAMPLES[$("#se").value] }, null, 2));
  $("#dlO").onclick = () => U.download("exemplo-saida-oportunidades.json", JSON.stringify({ schema: "opportunity-output-v1", generated_at: "2026-10-30T12:00:00Z", window_days: 30, opportunities: [{ id: "C-1001|6|email", customer_id: "C-1001", customer: "Exemplo", cs_owner: "Ana Souza", service_id: "6", service: "Backup Gerenciado", origin: "email", score: 78, level: "alta", score_parts: { evidencia: 16, urgencia: 19, aderencia: 25, receita: 18 }, status: "nova", discard_reason: null, value_estimate_year: 21600, evidence: [{ type: "email", date: "2026-10-22", from: "m***@exemplo.com.br", ref: "T-77/msg-0001", text: "…perdemos arquivos. Precisamos de uma rotina de backup até dezembro.", signal: "dor: backup" }], next_action: "Retornar em até 24h e agendar reunião de diagnóstico", draft: "Olá Maria, …" }] }, null, 2));
};

  <p class="small muted" id="aiOut">A chave fica apenas neste navegador (localStorage, fora de backups/exportações). Ao ativar, as perguntas do chat são enviadas ao endpoint configurado. Ambiente de homologação: em produção a chamada deve passar por um backend (sem expor a chave).</p></div></div>`;

  $("#aiTst").onclick = async () => { const c = aiRead(), err = aiValid(c), o = $("#aiOut"); if (err) return toast(err); o.textContent = "Testando…"; try { const t = await AI.complete([{ role: "user", content: "Responda apenas: OK" }], c); $("#aiOn").checked = true; o.textContent = "✔ Conexão OK. Resposta: " + t.slice(0, 120) + " — clique em Salvar para ativar no Chat."; } catch (e) { o.textContent = "✘ Falha: " + (e.message || e) + (e instanceof TypeError ? " (verifique endpoint, rede e CORS)" : ""); } };

};

      [2, 8, "Queda de energia", "Tivemos queda de energia e perdemos arquivos importantes. Precisamos de uma rotina de backup o quanto antes."],
      [3, 12, "Proposta externa", "Recebemos uma cotação com concorrente Alfa, mais barata, para suporte contínuo. Queremos avaliar com vocês antes de decidir; prazo até dia 20."],
      [4, 6, "Auditoria", "Teremos auditoria de LGPD em março e precisamos de adequação e segurança da informação. Podem indicar um plano?"],
      [5, 15, "Migração", "Estamos avaliando migrar o servidor para a nuvem (Azure). Prazo até dezembro. Contato: joao@cliente-exemplo.com.br, (11) 98888-7777."],
      [6, 4, "Dúvida simples", "Obrigado pelo atendimento de ontem, excelente. Apenas confirmando o horário da próxima visita."],
      [7, 2, "Resposta automática", "Estou fora do escritório até segunda-feira."],
      [8, 9, "Chamado demorado", "O chamado demorado da semana passada nos incomodou; precisamos de SLA e suporte mais rápido, caso contrário vamos cancelar."]];
    const emails = T.map(([i, ago, subj, body], k) => ({ external_id: `msg-${1000 + k}`, customer_id: pick(i + 2), thread_id: `T-${100 + k}`, date: d(ago), from: `contato${k}@cliente-exemplo.com.br`, subject: subj, body }));
    emails.push({ external_id: "msg-2000", customer_id: pick(1), thread_id: "T-200", date: d(3), from: "cs@helpitech.com.br", subject: "Interno: acompanhamento", body: "Lembrar de tratar backup e nuvem com este cliente.", internal: true });
    return { emails };
  }
};
function loadSample() {
  if (!SAMPLE_LEGACY) return toast("Dados de exemplo indisponíveis.");
  const prevRole = DB.s.settings.role; DB.s.settings.role = "admin";
  const cust = Sample.customers(JSON.parse(JSON.stringify(SAMPLE_LEGACY.customers))), cons = Object.assign({}, { contracts: JSON.parse(JSON.stringify(SAMPLE_LEGACY.contracts.contracts)) });
  const first = Importer.plan([...Importer.detect(Sample.services()), ...Importer.detect(cust), ...Importer.detect(cons)], DB.s, Ctx.dict()); Importer.apply(first, DB.s, { file: "exemplo (formato atual + serviços)", role: "admin" });
  const contracts = DB.list("contracts"), second = Importer.plan([...Importer.detect(Sample.usage(contracts)), ...Importer.detect(Sample.emails(DB.list("customers")))], DB.s, Ctx.dict()); const h = Importer.apply(second, DB.s, { file: "exemplo (consumo + e-mails sintéticos)", role: "admin" });
  DB.s.settings.role = prevRole; DB.audit("carregar_exemplo", "dados fictícios"); DB.save(); toast("Dados de exemplo carregados."); go(current);
}
/* ============================================================
   12. AUTOTESTES (funções puras)
   ============================================================ */
const SelfTest = {
  run() {
    const out = [], t = (name, fn) => { try { const r = fn(); out.push({ name, ok: r === true, err: r === true ? "" : String(r) }); } catch (e) { out.push({ name, ok: false, err: e.message }); } };
    t("parseMoney BR", () => U.parseMoney("4.000,00") === 4000 && U.parseMoney("3.500,50") === 3500.5 && U.parseMoney(12) === 12);
    t("validate: obrigatórios", () => V.validate({ name: "x" }, SCHEMAS.customers).length >= 2);
    t("validate: data inválida", () => V.validate({ external_id: 1, customer_id: 1, service_id: 1, value: 1, start_date: "2026-02-30", end_date: "2026-03-01" }, SCHEMAS.contracts).some(e => e.includes("start_date")));
    t("validate: registro válido", () => V.validate(EXAMPLES.customers[0], SCHEMAS.customers).length === 0);
    t("normalizador legado de contrato", () => { const c = N.contract({ store: { id: 5 }, type: { id: 4 }, amount_hours: 10, value: "1.000,00", date_start: "2026-01-01", date_end: "2026-12-31", disabled_at: null }); return c.customer_id === 5 && c.value === 1000 && c.hours === 10; });
    t("períodos e anterior", () => { const r = M.range("7", "2026-10-30"), p = M.previous(r); return r.start === "2026-10-24" && p.end === "2026-10-23" && U.days(p.start, p.end) === 6; });
    t("delta", () => M.delta(150, 100) === 50 && M.delta(5, 0) === null && M.delta(0, 0) === 0);
    t("franquia: excesso/baixo", () => { const c = { start_date: "2026-01-01", end_date: "2026-12-31", hours: 100, status: "vigente" }; return M.contractStatus(c, [{ date: "2026-03-01", quantity: 120 }], "2026-06-30").flag === "excesso" && M.contractStatus(c, [{ date: "2026-03-01", quantity: 5 }], "2026-09-30").flag === "baixo"; });
    t("sinais: backup + urgência", () => { const s = Signals.extract("Perdemos arquivos, precisamos de backup o quanto antes."); return s.hits.some(h => h.service_id === "2") && s.urgent; });
    t("sinais: PII mascarada no trecho", () => !Signals.extract("Backup. fale com a@b.com.br", DEFAULT_DICT).hits[0].snippet.includes("a@b.com.br"));
    t("score alta/baixa", () => Opp.level(Opp.score({ nEvid: 2, latest: "2026-10-29", urgency: 19, missing: true, value: 40000 }, "2026-10-30").total) === "alta" && Opp.level(Opp.score({ nEvid: 1, latest: null, urgency: 0, missing: false, value: 0 }, "2026-10-30").total) === "baixa");
    t("importação idempotente", () => { const st = blank(); const g = [["services", [{ external_id: 1, name: "Svc" }]]]; Importer.apply(Importer.plan(g, st, DEFAULT_DICT), st, { file: "t" }); const r = Importer.plan(g, st, DEFAULT_DICT); return r[0].rows[0].status === "igual" && Object.keys(st.services).length === 1; });
    t("reverter importação", () => { const st = blank(); const h = Importer.apply(Importer.plan([["services", [{ external_id: 9, name: "Zed" }]]], st, DEFAULT_DICT), st, { file: "t" }); Importer.revert(st, h.id); return !st.services["9"]; });
    t("integridade referencial", () => Importer.plan([["contracts", [{ external_id: 1, customer_id: 99, service_id: 1, value: 1, start_date: "2026-01-01", end_date: "2026-02-01" }]]], blank(), DEFAULT_DICT)[0].rows[0].status === "erro");
    t("e-mail interno ignorado", () => Signals.email({ external_id: 1, customer_id: 1, thread_id: "t", date: "2026-10-01", from: "x@helpitech.com.br", subject: "a", body: "backup" }, DEFAULT_DICT).ignored === "interno");
    t("sem evidência → sem oportunidade", () => Opp.analyze({ customers: [{ external_id: "1", name: "A", status: "ativo", contacts: [] }], services: [{ external_id: "4", name: "B", price: 1 }], contracts: [], usage: [], emails: [], today: "2026-10-30", windowDays: 30, dict: DEFAULT_DICT }).length === 0);
    return out;
  }
};
/* ============================================================
   13. SHELL — navegação, tema, perfis
   ============================================================ */
let current = "dashboard";
function go(page) {
  if (!Acc.role().pages.includes(page)) page = "dashboard"; current = page; location.hash = page;
  $("#appTitle").textContent = PAGE_META[page][0];
  $$("#drawer a").forEach(a => a.dataset.page === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  Pages[page]($("#main")); closeDrawer(); window.scrollTo(0, 0);
}
function buildNav() { $("#drawer").innerHTML = Acc.role().pages.map(p => `<a data-page="${p}" href="#${p}" tabindex="0">${ic(PAGE_META[p][1])}<span>${PAGE_META[p][0]}</span></a>`).join(""); $$("#drawer a").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.page); }); }
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("on"); }
function applyTheme() { const t = DB.s.settings.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = t; }
function applyRole() {
  const s = DB.s.settings; $("#roleSel").innerHTML = Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === s.role ? "selected" : ""}>${v.label}</option>`).join("");
  const owners = [...new Set(DB.list("customers").map(c => c.cs_owner).filter(Boolean))]; if (!owners.length) owners.push("Ana Souza", "Bruno Lima", "Carla Dias"); if (!owners.includes(s.cs)) s.cs = owners[0];
  $("#csSel").innerHTML = owners.map(o => `<option ${o === s.cs ? "selected" : ""}>${U.esc(o)}</option>`).join(""); $("#csWrap").hidden = s.role !== "cs";
  const m = Acc.masked(); $("#maskBtn").setAttribute("aria-pressed", m); $("#maskBtn").textContent = m ? "LGPD: mascarado" : "LGPD: visível"; $("#maskBtn").disabled = s.role === "suporte";
  buildNav();
}
function init() {
  DB.load(); applyTheme();
  $("#menuBtn").innerHTML = ic("menu"); $("#themeBtn").innerHTML = ic("theme");
  $("#menuBtn").onclick = () => { $("#drawer").classList.toggle("open"); $("#scrim").classList.toggle("on"); }; $("#scrim").onclick = closeDrawer;
  $("#themeBtn").onclick = () => { DB.s.settings.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; applyTheme(); DB.save(); };
  $("#roleSel").onchange = e => { DB.s.settings.role = e.target.value; DB.audit("trocar_perfil", e.target.value); DB.save(); applyRole(); go(current); };
  $("#csSel").onchange = e => { DB.s.settings.cs = e.target.value; DB.audit("trocar_cs", e.target.value); DB.save(); go(current); };
  $("#maskBtn").onclick = () => { DB.s.settings.mask = !DB.s.settings.mask; DB.audit(DB.s.settings.mask ? "mascarar_dados" : "revelar_dados", ""); DB.save(); applyRole(); go(current); };
  $("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
  if (DB.s.settings.seeded !== 2) { DB.s.settings.seeded = 2; loadSample(); }
  applyRole(); const h = location.hash.slice(1); go(PAGE_META[h] ? h : "dashboard");
  if (!DB.s.settings.ackLgpd) openDialog(`<h3>Aviso de uso de dados (LGPD)</h3><p>Este é um ambiente de <b>homologação</b>. Os dados ficam <b>somente neste navegador</b> (localStorage) e não são enviados a nenhum servidor. Dados pessoais são mascarados por padrão, e-mails são reduzidos a resumo + referência, e as ações são registradas em auditoria. Use apenas dados anonimizados ou com base legal adequada.</p><div class="dlg-actions"><button class="btn" id="ackB">Entendi</button></div>`);
  const ack = $("#ackB"); if (ack) ack.onclick = () => { DB.s.settings.ackLgpd = true; DB.save(); $("#dlg").close(); };
  if (location.search.includes("selftest")) { const r = SelfTest.run(); document.title = "SELFTEST " + r.filter(x => x.ok).length + "/" + r.length; console.log(r.filter(x => !x.ok)); }
}
document.addEventListener("DOMContentLoaded", init);
