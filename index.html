<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal CS · Grupo Helpitech</title>
<meta name="description" content="Portal de Customer Success — clientes, contratos, consumo e oportunidades.">
<link rel="icon" href="assets/logo-helpitech.png">
<link rel="stylesheet" href="ds/styles.css">
<style>
/* ——— Layout da aplicação (Design System Grupo Helpitech) ——— */
html,body{height:100%}
body{overflow:hidden}
.app{display:grid;grid-template-columns:var(--sidenav-w) minmax(0,1fr);height:100vh}
.app>.ht-sidenav{height:100vh}
.col{height:100vh;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;min-height:64px;padding:10px 32px;display:flex;align-items:center;gap:12px;background:rgba(248,249,255,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle)}
.topbar .ht-breadcrumbs{flex:1;min-width:0}
.topbar .ht-breadcrumbs a{cursor:pointer}
#menuBtn{display:none}
main{padding:28px 32px 56px;display:flex;flex-direction:column;gap:24px;width:100%;max-width:1440px;margin:0 auto}
main:focus{outline:none}
.nav-head{display:flex;flex-direction:column;gap:10px}
.nav-head img{height:36px;width:auto;align-self:flex-start}
.nav-head span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)}
.nav-user{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--surface-sunken)}
.nav-user b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-user small{font-size:12px;color:var(--text-secondary)}
.nav-scrim{display:none}
.lgpd-banner{position:sticky;top:64px;z-index:29}
/* Cabeçalho de página */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font:var(--text-h3);font-weight:700;letter-spacing:-.018em;margin:0}
.ph p{margin:4px 0 0;font:var(--text-body-sm);color:var(--text-secondary)}
.ph__acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ph__id{display:flex;align-items:center;gap:16px}
/* Grades e cartões */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1280px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-h h2,.card-h h3{font:var(--text-h5);letter-spacing:-.01em;margin:0}
.card-h p{margin:2px 0 0;font:var(--text-caption);color:var(--text-secondary)}
.ht-card{padding:var(--space-6)}
.ht-card.ht-card--pad-none{padding:0}
.ht-card>.ht-btn{align-self:flex-start}
.kpi{gap:6px;padding:20px}
.kpi__top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi__l{font:var(--text-body-sm);font-weight:500;color:var(--text-secondary)}
.kpi__v{font:var(--text-h2);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.kpi__n{font:var(--text-caption);color:var(--text-secondary)}
.tile{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;flex-shrink:0;background:var(--color-primary-fixed);color:var(--color-primary)}
.tile .ms{font-size:20px}
.tile--success{background:var(--color-success-container);color:var(--color-success)}
.tile--warning{background:var(--color-warning-container);color:var(--color-warning)}
.tile--error{background:var(--color-error-container);color:var(--color-error)}
.tile--lg{width:44px;height:44px;border-radius:12px}
.tile--lg .ms{font-size:24px}
.tile--brand{background:var(--gradient-brand);color:#fff}
.muted{color:var(--text-secondary)}
.small{font:var(--text-caption)}
.sp{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{padding:12px 0;border-top:1px solid var(--border-subtle);display:flex;gap:12px;align-items:center}
.list>li:first-child{border-top:0;padding-top:0}
.list>li:last-child{padding-bottom:0}
.list__main{flex:1;min-width:0}
.list__main b{font-weight:600;display:block;font-size:14px}
.list__main span{font-size:13px;color:var(--text-secondary)}
.list--click>li{cursor:pointer;border-radius:8px}
.list--click>li:hover b{color:var(--color-primary)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Hero do dashboard */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:28px;padding:28px 32px;border-radius:var(--radius-xl);background:var(--gradient-hero-dark);color:#fff}
.hero .ht-overline{color:var(--color-accent-sky)}
.hero h1{font:var(--text-h2);font-weight:700;letter-spacing:-.02em;margin:8px 0 6px;color:#fff}
.hero p{margin:0;color:var(--slate-300);font:var(--text-body)}
.prio{display:flex;flex-direction:column;gap:8px}
.prio button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04);color:#fff;text-align:left;font:inherit;cursor:pointer;transition:background-color var(--dur-fast) var(--ease-standard)}
.prio button:hover{background:rgba(255,255,255,.09)}
.prio button:focus-visible{outline:2px solid var(--focus-ring-on-dark);outline-offset:2px}
.prio .pi{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:rgba(99,173,222,.12);color:var(--color-accent-sky);flex-shrink:0}
.prio b{display:block;font-size:14px;font-weight:600}
.prio small{display:block;font-size:12px;color:var(--slate-400)}
.prio .ms:last-child{margin-left:auto;color:var(--slate-400)}
/* Franquia */
.fbar{display:flex;flex-direction:column;gap:6px;min-width:160px}
.fbar__track{position:relative;height:8px;border-radius:999px;background:var(--color-surface-container)}
.fbar__fill{height:100%;border-radius:inherit;max-width:100%}
.fbar__mark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:var(--color-ink)}
.fbar__cap{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.mini{height:4px;border-radius:999px;background:var(--color-surface-container);overflow:hidden;margin-top:6px}
.mini>i{display:block;height:100%;border-radius:inherit;background:var(--color-tertiary)}
/* Gráficos */
.cchart{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px}
.cchart__y{position:relative;height:200px;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.cchart__y span{position:absolute;right:0;transform:translateY(50%)}
.cchart__plot{position:relative;height:200px;display:flex;align-items:flex-end;gap:10px;padding:0 4px;border-bottom:1px solid var(--border-default)}
.cchart__grid{position:absolute;left:0;right:0;border-top:1px dashed var(--border-subtle)}
.cchart__avg{position:absolute;left:0;right:0;border-top:2px dashed var(--color-tertiary);z-index:1}
.cchart__avg span{position:absolute;right:0;top:-18px;font-size:11px;font-weight:600;color:var(--color-tertiary);background:var(--color-surface);padding:0 4px}
.cchart__bar{position:relative;flex:1;min-width:6px;border-radius:8px 8px 2px 2px;background:var(--color-primary-container);transition:background-color var(--dur-fast) var(--ease-standard)}
.cchart__bar:hover{background:var(--color-primary)}
.cchart__bar b{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.cchart__x{grid-column:2;display:flex;gap:10px;padding:6px 4px 0;font-size:12px;color:var(--text-secondary)}
.cchart__x span{flex:1;min-width:6px;text-align:center;white-space:nowrap;overflow:hidden}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:13px}
.hbar__t{height:10px;border-radius:999px;background:var(--color-surface-container);overflow:hidden}
.hbar__t i{display:block;height:100%;border-radius:inherit;background:var(--color-primary-container)}
.hbar__v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.lchart{width:100%;height:auto;display:block}
.lchart text{font-size:11px;fill:var(--text-muted);font-family:var(--font-sans)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-secondary);margin-top:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.health{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--color-surface-container);gap:2px}
.health i{display:block;height:100%}
.hlegend{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hlegend div{display:flex;align-items:center;gap:10px;font-size:14px}
.hlegend i{width:10px;height:10px;border-radius:3px}
.hlegend b{margin-left:auto;font-variant-numeric:tabular-nums}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 8px;color:var(--text-secondary);font-size:14px}
.empty-state .circ{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--color-success-container);color:var(--color-success)}
.empty-state .circ--neutral{background:var(--color-surface-container);color:var(--text-secondary)}
.empty-state b{color:var(--text-primary);font-size:15px}
/* Monogramas e avatares */
.mono{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--color-primary-fixed);color:var(--color-on-primary-fixed-variant);font-weight:700;font-size:13px}
.mono--xl{width:60px;height:60px;border-radius:16px;background:var(--gradient-brand);color:#fff;font-size:22px}
.av{display:inline-grid;place-items:center;flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--color-primary);color:#fff;font-weight:700;font-size:11px}
.av--lg{width:36px;height:36px;font-size:13px}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
.cell{display:flex;align-items:center;gap:12px;min-width:0}
.cell>div{min-width:0}
/* Tabela em cartão */
.tcard{background:var(--color-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);overflow:hidden;min-width:0}
.tcard__bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border-subtle)}
.tcard__scroll{overflow-x:auto}
.tcard .ht-table th{padding:0 20px;white-space:nowrap}
.tcard .ht-table td{padding:12px 20px}
.tcard .ht-table tbody tr:last-child td{border-bottom:0}
.tcard__foot{display:flex;align-items:center;gap:8px;padding:10px 20px;border-top:1px solid var(--border-subtle);font-size:13px;color:var(--text-secondary)}
.tcard .ht-table th,.tcard .ht-table td{border-radius:0!important}
td.chev{width:40px;color:var(--text-muted);padding-left:0!important}
td.acts{white-space:nowrap;text-align:right}
.score{width:96px}
.score b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-right:6px}
.score small{font-size:12px;font-weight:600}
.score .mini>i{background:var(--color-primary)}
.ctl-w180{width:180px}.ctl-w160{width:160px}.ctl-w220{width:220px}
/* Faixa informativa */
.strip{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-md);background:var(--color-surface-container-low);font-size:14px;color:var(--text-secondary)}
.strip .ms{color:var(--color-primary)}
.strip b{color:var(--text-primary)}
/* Linha do tempo */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;display:flex;gap:12px;padding-bottom:16px}
.tl li:not(:last-child)::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--border-subtle)}
.tl .dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--color-primary-fixed);color:var(--color-primary)}
.tl .dot .ms{font-size:16px}
.tl b{display:block;font-size:14px;font-weight:600}
.tl span{font-size:12px;color:var(--text-secondary)}
/* Catálogo */
.svc{gap:0}
.svc__top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.svc h3{font:var(--text-h5);margin:0 0 6px}
.svc p{margin:0;font:var(--text-body-sm);color:var(--text-secondary)}
.svc__foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:16px;border-top:1px solid var(--border-subtle);font-size:13px;color:var(--text-secondary)}
.svc__foot .ms{font-size:18px;color:var(--color-primary)}
.svc__body{flex:1;padding-bottom:16px}
/* Gaveta (oportunidade) */
.drawer-scrim{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(2,6,23,.56);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:ht-fade-in var(--dur-base) var(--ease-standard)}
[hidden]{display:none!important}
.drawer{width:min(560px,100%);height:100%;display:flex;flex-direction:column;background:var(--color-surface);border-radius:var(--radius-xl) 0 0 var(--radius-xl);box-shadow:var(--shadow-xl);animation:slide-in .22s var(--ease-decelerate)}
@keyframes slide-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer__head{display:flex;gap:12px;align-items:flex-start;padding:24px 24px 16px;border-bottom:1px solid var(--border-subtle)}
.drawer__head h2{font:var(--text-h4);letter-spacing:-.01em;margin:6px 0 2px}
.drawer__head p{margin:0;font-size:14px;color:var(--text-secondary)}
.drawer__body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.drawer__body h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 10px}
.drawer__foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--border-subtle);background:var(--surface-sunken);border-radius:0 0 0 var(--radius-xl)}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.blk{padding:16px;border-radius:var(--radius-lg);background:var(--color-surface-container-low)}
.blk small{display:block;font-size:12px;font-weight:600;color:var(--text-secondary)}
.blk b{display:block;font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.blk--brand{background:var(--gradient-brand);color:#fff}
.blk--brand small{color:rgba(255,255,255,.8)}
.blk--brand b{font-size:36px;line-height:1.1}
.evid{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);background:var(--surface-sunken);font-size:14px}
.evid .ms{color:var(--color-primary)}
.evid small{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.evid+.evid{margin-top:8px}
.comp{display:grid;grid-template-columns:170px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:14px;padding:6px 0}
.comp b{text-align:right;font-variant-numeric:tabular-nums}
pre.code{margin:0;padding:14px 16px;border-radius:var(--radius-md);background:var(--surface-sunken);border:1px solid var(--border-subtle);font:12.5px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text-primary);overflow:auto;max-height:420px;white-space:pre-wrap}
/* Chat */
.chatwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.chat{height:calc(100vh - 150px);min-height:460px;overflow:hidden}
.chat__head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-subtle)}
.chat__head b{display:block;font-size:15px}
.chat__head small{font-size:12px;color:var(--text-secondary)}
.chat__msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--color-background)}
.msg-u{align-self:flex-end;max-width:72%;padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--color-primary);color:#fff;font-size:14px}
.msg-a{display:flex;gap:10px;max-width:86%}
.msg-a .tile{width:32px;height:32px;border-radius:10px}
.msg-a .tile .ms{font-size:18px}
.msg-a>div{padding:12px 16px;border-radius:4px 16px 16px 16px;background:var(--color-surface);border:1px solid var(--border-subtle);font-size:14px;box-shadow:var(--shadow-xs)}
.msg-a ul{margin:6px 0 0;padding-left:18px}
.msg-a>div{min-width:0}.msg-a .tw{margin:8px 0;overflow:auto;border:1px solid var(--border-subtle);border-radius:var(--radius-md)}.msg-a table{border-collapse:collapse;font-size:13px;width:100%}.msg-a th,.msg-a td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--border-subtle);white-space:nowrap}.msg-a th{background:var(--surface-sunken);font-weight:600}.msg-a .mt{margin:8px 0 0}.msg-a code{font-size:12.5px}
.chat__sugg{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px 0;border-top:1px solid var(--border-subtle)}
.chat__form{display:flex;gap:8px;padding:12px 20px 16px}
.chat__form .ht-control{flex:1}
/* Docs */
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.docs__nav{position:sticky;top:96px}
.docs__nav .ht-sidenav__item{height:auto;min-height:2.5rem;padding:8px 12px}
.prose{max-width:760px}
.prose h2{font:var(--text-h2);font-weight:700;letter-spacing:-.02em;margin:8px 0 12px}
.prose .lead{font:var(--text-body-lg);color:var(--text-secondary);margin:0 0 24px}
.prose h4{font:var(--text-h4);margin:28px 0 10px}
.prose p,.prose li{font:var(--text-body);color:var(--text-primary)}
.prose ul,.prose ol{padding-left:22px}
.prose li{margin:4px 0}
.prose code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;background:var(--surface-sunken);padding:1px 6px;border-radius:4px}
.prose .ht-alert{margin-top:28px}
/* Configurações */
.narrow{max-width:960px;width:100%}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--border-subtle)}
.swrow:first-of-type{border-top:0}
.cfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border-subtle)}
.ht-card h2.h5{font:var(--text-h5);margin:0 0 4px}
.ht-card p.desc{margin:0 0 20px;font:var(--text-body-sm);color:var(--text-secondary)}
/* Diálogos nativos com o visual de Modal do DS */
dialog.ht-modal{margin:auto;padding:0;border:0;max-height:calc(100vh - 2rem)}
dialog.ht-modal:not([open]){display:none}
dialog.ht-modal::backdrop{background:var(--surface-scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ht-modal__body .fgrid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ht-modal__body .full{grid-column:1/-1}
.ht-modal__body ul{margin:0;padding-left:18px}
/* Snackbar */
#snack{position:fixed;left:50%;bottom:24px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:min(560px,calc(100% - 32px));padding:12px 18px;border-radius:var(--radius-md);background:var(--color-ink);color:#fff;font-size:14px;box-shadow:var(--shadow-lg);transition:all var(--dur-base) var(--ease-standard)}
#snack.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Responsivo */
@media (max-width:1100px){.g-main,.chatwrap{grid-template-columns:minmax(0,1fr)}.docs{grid-template-columns:minmax(0,1fr)}.docs__nav{position:static}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app>.ht-sidenav{position:fixed;inset:0 auto 0 0;z-index:45;transform:translateX(-100%);transition:transform var(--dur-base) var(--ease-standard);box-shadow:var(--shadow-xl)}
  .app>.ht-sidenav.open{transform:none}
  .nav-scrim.on{display:block;position:fixed;inset:0;z-index:44;background:var(--surface-scrim)}
  #menuBtn{display:inline-grid}
  .topbar{padding:10px 16px;flex-wrap:wrap}
  .topbar .tb-search{display:none}

<script>
"use strict";
/* ============================================================
   0. UTILITÁRIOS (funções puras)
   ============================================================ */
const U = {
  esc: s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])),
  norm: s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""),
  pad: n => String(n).padStart(2, "0"),
  iso(d) { return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}`; },
  today() { return U.iso(new Date()); },
  isDate(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || "")) return false; const d = new Date(s + "T00:00:00"); return !isNaN(d) && U.iso(d) === s; },
  d(s) { return new Date(String(s).slice(0, 10) + "T00:00:00"); },
  addDays(s, n) { const d = U.d(s); d.setDate(d.getDate() + n); return U.iso(d); },
  days(a, b) { return Math.round((U.d(b) - U.d(a)) / 864e5); },
  fmtDate: s => s ? String(s).slice(0, 10).split("-").reverse().join("/") : "—",
  money: n => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }),
  num: (n, d = 1) => (Number(n) || 0).toLocaleString("pt-BR", { maximumFractionDigits: d }),
  parseMoney(v) {
    if (typeof v === "number") return v;
    if (typeof v !== "string") return NaN;
    let s = v.replace(/R\$|\s/g, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
  },
  deepEq: (a, b) => JSON.stringify(a) === JSON.stringify(b),
  sum: (a, f) => a.reduce((t, x) => t + (f ? f(x) : x), 0),
  group(arr, f) { const m = new Map(); for (const x of arr) { const k = f(x); (m.get(k) || m.set(k, []).get(k)).push(x); } return m; },
  csv(rows, cols) {
    const q = v => { const s = String(v ?? ""); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return "\ufeff" + [cols.map(c => q(c.label)), ...rows.map(r => cols.map(c => q(c.val(r))))].map(r => r.join(";")).join("\r\n");
  },
  download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: type || "application/json" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
};

  doc: s => { const d = String(s || "").replace(/\D/g, ""); return d.length === 14 ? `${d.slice(0, 2)}.***.***/****-${d.slice(12)}` : d.length === 11 ? `***.***.${d.slice(6, 9)}-**` : s ? "***" : "—"; },
  email: s => { const m = String(s || "").match(/^(.)[^@]*(@.+)$/); return m ? `${m[1]}***${m[2]}` : "—"; },
  phone: s => { const d = String(s || "").replace(/\D/g, ""); return d.length >= 8 ? `(**) ****-${d.slice(-4)}` : "—"; },
  scrub: t => String(t || "").replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, "[e-mail]").replace(/\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/g, "[CPF]").replace(/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/g, "[CNPJ]").replace(/\(?\b\d{2}\)?\s?9?\d{4}-?\d{4}\b/g, "[tel]")

      description: { type: "string" }
    }
  },
  emails: {
    $schema: "http://json-schema.org/draft-07/schema#", title: "E-mail do CS (anonimizado)", type: "object", required: ["external_id", "customer_id", "thread_id", "date", "from", "subject"],
    description: "Informe body OU summary. O corpo NÃO é armazenado: só resumo, sinais e referência.",
    properties: {
      external_id: { type: ["string", "integer"], description: "ID/Message-ID do e-mail (referência)" }, customer_id: { type: ["string", "integer"] }, thread_id: { type: "string" },
      date: { type: "string", format: "date" }, from: { type: "string" }, to: { type: "string" }, subject: { type: "string" },
      body: { type: "string" }, summary: { type: "string" }, internal: { type: "boolean", description: "true = mensagem interna (ignorada)" }
    }
  }
};
const ENTITY_LABEL = { customers: "Clientes", services: "Serviços", contracts: "Contratos", usage_events: "Consumo", emails: "E-mails" };
const IMPORT_ORDER = ["services", "customers", "contracts", "usage_events", "emails"];
const EXAMPLES = {
  customers: [{ external_id: "C-1001", name: "Exemplo Indústria Ltda", trading_name: "Exemplo", document: "11.222.333/0001-81", status: "ativo", segment: "Indústria", size: "medio", cs_owner: "Ana Souza", city: "São Paulo", state: "SP", amount_tickets: 12, contacts: [{ name: "Maria Contato", email: "maria@exemplo.com.br", phone: "11999990000", role: "TI" }] }],
  services: [{ external_id: 4, name: "NOC", description: "Monitoramento 24x7 de servidores e rede", price: 1800, unit: "mês", est_units_year: 12, category: "Operação" }],
  contracts: [{ external_id: "K-2001", customer_id: "C-1001", service_id: 1, value: 3500, hours: 100, start_date: "2026-04-01", end_date: "2027-03-28", auto_renew: true, billing_day: 1, description: "Contrato anual de suporte", status: "vigente" }],
  usage_events: [{ external_id: "U-1", customer_id: "C-1001", date: "2026-10-20", quantity: 3.5, service_id: 1, description: "Chamado #4521 — ajuste de VPN" }],
  emails: [{ external_id: "msg-0001", customer_id: "C-1001", thread_id: "T-77", date: "2026-10-22", from: "maria@exemplo.com.br", subject: "Backup", body: "Tivemos queda de energia e perdemos arquivos. Precisamos de uma rotina de backup até dezembro.", internal: false }]
};
/* ============================================================
   2. VALIDAÇÃO (puro) — mini JSON Schema + regras de negócio
   ============================================================ */
const V = {
  typeOk(v, t) { return ({ string: typeof v === "string", number: typeof v === "number" && isFinite(v), integer: Number.isInteger(v), boolean: typeof v === "boolean", array: Array.isArray(v), object: v && typeof v === "object" && !Array.isArray(v), null: v === null })[t]; },
  validate(v, sc, path = "") {
    const e = [];

    if (sc.enum && !sc.enum.includes(v)) e.push(`${path}: valor deve ser um de ${sc.enum.join(", ")}`);
    if (typeof v === "string") {
      if (sc.minLength && v.length < sc.minLength) e.push(`${path}: mínimo ${sc.minLength} caracteres`);
      if (sc.pattern && !new RegExp(sc.pattern).test(v)) e.push(`${path}: formato inválido (${sc.pattern})`);
      if (sc.format === "date" && !U.isDate(v)) e.push(`${path}: data inválida, use AAAA-MM-DD`);
      if (sc.format === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) e.push(`${path}: e-mail inválido`);
    }
    if (typeof v === "number") {
      if (sc.minimum != null && v < sc.minimum) e.push(`${path}: mínimo ${sc.minimum}`);
      if (sc.maximum != null && v > sc.maximum) e.push(`${path}: máximo ${sc.maximum}`);
    }
    if (Array.isArray(v) && sc.items) v.forEach((x, i) => e.push(...V.validate(x, sc.items, `${path}[${i}]`)));

  },
  business(entity, r, ctx) {
    const e = [];
    if (entity === "contracts") {
      if (U.isDate(r.start_date) && U.isDate(r.end_date) && r.end_date < r.start_date) e.push("end_date: anterior a start_date");
      if (r.customer_id != null && !ctx.customers.has(String(r.customer_id))) e.push(`customer_id: cliente ${r.customer_id} não encontrado`);
      if (r.service_id != null && !ctx.services.has(String(r.service_id))) e.push(`service_id: serviço ${r.service_id} não encontrado`);
    }
    if (entity === "usage_events" || entity === "emails") {
      if (r.customer_id != null && !ctx.customers.has(String(r.customer_id))) e.push(`customer_id: cliente ${r.customer_id} não encontrado`);
    }

    if (entity === "customers" && r.document) { const d = String(r.document).replace(/\D/g, ""); if (d.length !== 11 && d.length !== 14) e.push("document: CPF (11) ou CNPJ (14) dígitos"); }

  }

/* ============================================================
   3. NORMALIZADORES — formato legado (sistema atual) → canônico
   ============================================================ */
const N = {
  customer(r) {
    if (!(r && typeof r === "object") || !("is_active" in r || "cnpj" in r || "opening_users" in r)) return r;

    const out = { external_id: r.id, name: r.name, trading_name: r.trading_name || undefined, document: r.cnpj || r.cpf || undefined, ie: r.ie || undefined, status: r.status || (r.is_active ? "ativo" : "inativo"), city: main.city, state: main.state, amount_tickets: r.amount_tickets, contacts };
    for (const k of ["segment", "size", "cs_owner"]) if (r[k]) out[k] = r[k];
    return out;
  },
  service(r) {
    if (r && "id" in r && !("external_id" in r)) return { external_id: r.id, name: r.name, description: r.description, unit: r.unit || "contrato", category: "contrato" };
    return r;
  },
  contract(r) {
    if (!(r && r.store && r.type)) return r;
    const ok = !r.disabled_at;
    return { external_id: r.external_id || `L-${r.store.id}-${r.type.id}-${r.date_start}`, customer_id: r.store.id, service_id: N.serviceOf(r), value: U.parseMoney(r.value), hours: r.amount_hours, start_date: r.date_start, end_date: r.date_end, billing_day: r.billing_day, description: r.description || undefined, status: ok ? undefined : "cancelado", reason_disable: r.reason_disable || undefined };
  },
  /* `type` do formato atual é apenas o tipo de cobrança (mensal, anual, bolsa…); o serviço é inferido da descrição/natureza do contrato */
  serviceOf(r) {
    const d = U.norm ? U.norm(r.description || "") : String(r.description || "").toLowerCase();
    if (/desenvolv/.test(d)) return 3;
    if (/manuten/.test(d)) return 7;
    if (/backup/.test(d)) return 2;
    if (/noc|monitor/.test(d)) return 4;
    if (/soc|seguranca/.test(d)) return 5;
    if (/projeto/.test(d) || (r.type && /projeto/i.test(r.type.name || ""))) return 6;
    return 1;
  },
  clean(o) { const x = {}; for (const [k, v] of Object.entries(o || {})) if (v !== undefined && v !== null && v !== "") x[k] = v; return x; }
};
/* ============================================================

   ============================================================ */
const DEFAULT_DICT = {
  rules: [
    { key: "suporte-horas", service_id: "1", kind: "necessidade", weight: 1, terms: ["mais horas", "pacote de horas", "horas acabando", "horas acabaram", "estourou a franquia", "ampliar o pacote", "bolsa de horas"] },
    { key: "suporte-sla", service_id: "1", kind: "dor", weight: 1, terms: ["sla", "suporte 24", "atendimento urgente", "chamado demorado", "demora no atendimento", "suporte mais rapido", "suporte continuo"] },
    { key: "desenvolvimento", service_id: "3", kind: "projeto", weight: 1, terms: ["novo sistema", "desenvolvimento de", "integracao com", "automatizar", "automacao", "customizacao", "sistema sob medida"] },
    { key: "projetos", service_id: "6", kind: "projeto", weight: 1, terms: ["implantar", "implantacao", "novo projeto", "cronograma", "novo escritorio", "nova filial", "troca de servidor"] },
    { key: "noc", service_id: "4", kind: "dor", weight: 1, terms: ["fora do ar", "ficou fora", "indisponibilidade", "ninguem avisou", "monitoramento", "monitorar", "alertas de servidor", "lentidao", "link caiu"] },
    { key: "soc", service_id: "5", kind: "dor", weight: 1, terms: ["phishing", "invasao", "ataque", "malware", "vazamento", "acesso suspeito", "incidente de seguranca", "siem"] },
    { key: "backup", service_id: "2", kind: "dor", weight: 1, terms: ["backup", "perdemos dados", "perdemos arquivos", "restaurar", "ransomware", "recuperacao de desastre"] },
    { key: "manutencao", service_id: "7", kind: "necessidade", weight: .9, terms: ["manutencao preventiva", "atualizar os servidores", "atualizacao de servidor", "patch", "servidor desatualizado"] },
    { key: "seguranca-lgpd", service_id: "8", kind: "necessidade", weight: 1, terms: ["lgpd", "auditoria", "seguranca da informacao", "iso 27001", "adequacao"] },
    { key: "nuvem", service_id: "9", kind: "projeto", weight: 1, terms: ["nuvem", "cloud", "migrar o servidor", "migracao para", "aws", "azure"] },
    { key: "licencas", service_id: "10", kind: "necessidade", weight: .9, terms: ["licenca", "microsoft 365", "office 365", "antivirus", "renovar licencas"] }
  ],
  complaint: ["reclam", "insatisf", "demora", "demorou", "fora do ar", "parou", "falha", "problema", "queda", "pessimo", "inaceitavel", "cancelar"],
  positive: ["obrigad", "excelente", "parabens", "satisfeit", "otimo", "agradec"],
  urgent: ["urgente", "o quanto antes", "ate dia", "prazo", "esta semana", "proxima semana", "imediat", "ate dezembro", "ate o fim do mes"],
  competitor: ["concorrente", "outra empresa", "proposta de outro", "cotacao com", "orcamento de outra"],
  irrelevant_subject: ["resposta automatica", "out of office", "fora do escritorio", "newsletter", "delivery status"],
  internal_domains: ["helpitech.com.br"]

const Signals = {
  snippet(text, idx, len) { const s = Math.max(0, idx - 60), e = Math.min(text.length, idx + len + 80); return (s ? "…" : "") + text.slice(s, e).replace(/\s+/g, " ").trim() + (e < text.length ? "…" : ""); },
  extract(rawText, dict = DEFAULT_DICT) {

const M = {
  range(kind, today, custom) {

    const n = kind === "7" ? 7 : kind === "15" ? 15 : 30;
    return { start: U.addDays(today, -(n - 1)), end: today };
  },
  previous(r) { const len = U.days(r.start, r.end) + 1; return { start: U.addDays(r.start, -len), end: U.addDays(r.start, -1) }; },
  inRange: (e, r) => e.date >= r.start && e.date <= r.end,
  /* atribui o evento ao serviço: explícito > contrato vigente na data com franquia > "0" (não classificado) */
  serviceOf(e, contractsOfCustomer) {
    if (e.service_id) return String(e.service_id);
    const c = (contractsOfCustomer || []).find(c => c.status !== "cancelado" && e.date >= c.start_date && e.date <= c.end_date);
    return c ? String(c.service_id) : "0";
  },
  contractOf(e, cs) {
    const list = (cs || []).filter(c => c.status !== "cancelado" && e.date >= c.start_date && e.date <= c.end_date);
    return list.find(c => !e.service_id || String(c.service_id) === String(e.service_id)) || list[0] || null;
  },
  total: (events, r) => U.sum(events.filter(e => M.inRange(e, r)), e => e.quantity),
  groupSum(events, r, keyFn) { const m = new Map(); for (const e of events) if (M.inRange(e, r)) { const k = keyFn(e); m.set(k, (m.get(k) || 0) + e.quantity); } return m; },
  daily(events, r) { const len = U.days(r.start, r.end) + 1, out = Array(len).fill(0); for (const e of events) if (M.inRange(e, r)) out[U.days(r.start, e.date)] += e.quantity; return out; },
  delta: (cur, prev) => prev > 0 ? (cur - prev) / prev * 100 : (cur > 0 ? null : 0),
  /* consumo acumulado do contrato na vigência vs franquia; risco de churn (baixo uso) e excesso */
  contractStatus(c, events, today, th = { warn: .8, lowRatio: .5, minElapsed: .25 }) {
    const used = U.sum(events.filter(e => e.date >= c.start_date && e.date <= c.end_date && e.date <= today), e => e.quantity);
    const total = Math.max(1, U.days(c.start_date, c.end_date) + 1), el = Math.min(total, Math.max(0, U.days(c.start_date, today) + 1));

  expiring(contracts, today, days) { return contracts.filter(c => M.isActive(c, today)).map(c => ({ c, d: U.days(today, c.end_date) })).filter(x => x.d >= 0 && x.d <= days).sort((a, b) => a.d - b.d); }
};
/* ============================================================
   6. ANÁLISE DE OPORTUNIDADES (puro)
   ============================================================ */
const Opp = {
  level: s => s >= 70 ? "alta" : s >= 45 ? "media" : "baixa",
  /* score 0-100 = evidência(30) + urgência(25) + aderência(25) + receita(20) */
  score({ nEvid, latest, urgency, missing, value }, today) {
    const rec = latest ? (U.days(latest, today) <= 7 ? 6 : U.days(latest, today) <= 15 ? 3 : 0) : 0;
    const e = Math.min(30, nEvid * 10 + rec), u = Math.min(25, urgency), f = missing ? 25 : 12, r = Math.min(20, Math.round(20 * (value || 0) / 50000));
    return { total: e + u + f + r, parts: { evidencia: e, urgencia: u, aderencia: f, receita: r } };
  },
  value(svc) { return svc ? (svc.price || 0) * (svc.est_units_year ?? 12) : 0; },
  draft(o, svc, contact, cs) {
    const ev = o.evidence[0];
    return `Olá ${contact || "tudo bem"}, aqui é ${cs || "da equipe de Customer Success"} da HelpiTech.\n\n` +
      `Revendo nosso relacionamento${ev ? ` (${U.fmtDate(ev.date)}: "${ev.text.slice(0, 140)}")` : ""}, acredito que ${svc ? svc.name : "uma evolução do seu contrato"} pode ajudar vocês nesse ponto.\n\n` +
      `Posso agendar 20 minutos nesta semana para entender o cenário e apresentar uma proposta sob medida?\n\n[Rascunho para revisão do CS — não enviado automaticamente]`;
  },
  analyze({ customers, services, contracts, usage, emails, today, windowDays, dict }) {
    const out = [], svcs = new Map(services.map(s => [String(s.external_id), s]));
    const byC = U.group(contracts, c => c.customer_id), uByC = U.group(usage, e => e.customer_id), eByC = U.group(emails, e => e.customer_id);
    const wStart = U.addDays(today, -windowDays);
    const push = (cust, sid, origin, evidence, urgency, extra = {}) => {
      const svc = svcs.get(String(sid)), cs = byC.get(cust.external_id) || [];
      const active = new Set(cs.filter(c => M.isActive(c, today)).map(c => String(c.service_id)));
      const missing = !active.has(String(sid)), value = Opp.value(svc);
      const latest = evidence.map(e => e.date).sort().pop();

      const contact = (cust.contacts || [])[0]?.name;
      const o = { key: `${cust.external_id}|${sid}|${origin}`, customer_id: cust.external_id, customer: cust.trading_name || cust.name, cs_owner: cust.cs_owner || "", service_id: String(sid), service: svc?.name || `Serviço ${sid}`, origin, evidence, score: sc.total, parts: sc.parts, level: Opp.level(sc.total), value_est: value, missing, latest, ...extra };
      o.next_action = origin === "email" ? (extra.urgent ? "Retornar em até 24h e agendar reunião de diagnóstico" : "Contato esta semana para validar a necessidade e apresentar proposta") : origin === "renovacao" ? "Iniciar tratativa de renovação e revisar franquia/valores" : origin === "franquia" ? "Propor ampliação de franquia/bolsa antes do estouro" : "Apresentar proposta de contrato para formalizar o atendimento";
      o.draft = Opp.draft(o, svc, contact, cust.cs_owner);
      out.push(o);
    };
    for (const cust of customers) {

      const cs = byC.get(cust.external_id) || [], ev = uByC.get(cust.external_id) || [];
      /* (a) e-mails: sinais → serviço do catálogo */

      for (const [sid, list] of per) {
        if (!svcs.has(sid)) continue;
        const evidence = list.map(({ m, h }) => ({ type: "email", date: m.date, from: m.from_masked, ref: m.ref, subject: m.subject, text: h.snippet, signal: `${h.kind}: ${h.term}`, sentiment: m.signals.sentiment }));
        const urgent = list.some(x => x.m.signals.urgent), complaint = list.some(x => x.m.signals.complaint), comp = list.map(x => x.m.signals.competitor).find(Boolean);
        push(cust, sid, "email", evidence, (urgent ? 12 : 0) + (complaint ? 6 : 0) + (comp ? 7 : 0), { urgent, complaint, competitor: comp || null, deadline: list.map(x => x.m.signals.deadline).find(Boolean) || null });
      }
      /* (b) lacunas e dados do contrato */
      for (const c of cs.filter(c => M.isActive(c, today))) {
        const d = U.days(today, c.end_date), st = M.contractStatus(c, ev, today);
        if (d <= 60 && !c.auto_renew) push(cust, c.service_id, "renovacao", [{ type: "contrato", date: today, text: `Contrato ${c.external_id} vence em ${d} dias (${U.fmtDate(c.end_date)})`, ref: c.external_id }], d <= 7 ? 25 : d <= 15 ? 20 : d <= 30 ? 14 : 6);
        if (st.pct >= .8) push(cust, c.service_id, "franquia", [{ type: "uso", date: today, text: `Consumo de ${U.num(st.used)}h de ${c.hours}h (${U.num(st.pct * 100, 0)}%) na vigência`, ref: c.external_id }], st.pct > 1 ? 25 : 12);
      }
      const hasActive = cs.some(c => M.isActive(c, today));
      if (!hasActive && (cust.amount_tickets || 0) >= 20 && svcs.has("1")) push(cust, "1", "semcontrato", [{ type: "uso", date: today, text: `${cust.amount_tickets} chamados registrados e nenhum contrato vigente`, ref: cust.external_id }], Math.min(12, Math.round(cust.amount_tickets / 5)));

  }
};

const Importer = {
  parse(text) { try { return { json: JSON.parse(text) }; } catch (e) { return { error: "JSON inválido: " + e.message }; } },
  /* detecta entidades em formato canônico ({customers:[...]}) ou legado (customers como objeto, contracts com store/type) */
  detect(j) {
    const out = [];
    if (Array.isArray(j)) { const r = j[0] || {}; const ent = ("store" in r) ? "contracts" : ("is_active" in r || "cnpj" in r) ? "customers" : ("body" in r || "thread_id" in r) ? "emails" : ("quantity" in r) ? "usage_events" : ("customer_id" in r && "start_date" in r) ? "contracts" : ("price" in r || "unit" in r) ? "services" : ("status" in r || "name" in r) ? "customers" : null; return ent ? [[ent, j]] : []; }
    if (j && j.entity && Array.isArray(j.records)) return [[j.entity, j.records]];
    for (const ent of IMPORT_ORDER) if (j && j[ent] != null) out.push([ent, Array.isArray(j[ent]) ? j[ent] : Object.values(j[ent])]);
    return out.sort((a, b) => IMPORT_ORDER.indexOf(a[0]) - IMPORT_ORDER.indexOf(b[0]));
  },
  norm(ent, raw) { return ent === "customers" ? N.customer(raw) : ent === "services" ? N.service(raw) : ent === "contracts" ? N.contract(raw) : raw; },
  /* dry-run: não altera estado */
  plan(groups, state, dict) {
    const ctx = { customers: new Set(Object.keys(state.customers)), services: new Set(Object.keys(state.services)) };
    const today = U.today(), report = [];
    for (const [ent, recs] of groups) {
      const seen = new Set(), rows = [];
      recs.forEach((raw, i) => {
        let r = Importer.norm(ent, raw); r = r && typeof r === "object" && !Array.isArray(r) ? N.clean(r) : r;
        const errs = V.validate(r, SCHEMAS[ent]);
        const id = r && r.external_id != null ? String(r.external_id) : null;
        if (!errs.length) errs.push(...V.business(ent, r, ctx));
        if (id && seen.has(id)) errs.push("external_id duplicado no arquivo");
        if (errs.length) { rows.push({ idx: i + 1, id, status: "erro", errors: errs }); return; }
        seen.add(id);
        let rec = ent === "customers" ? Object.assign(r, { external_id: id, status: r.status }) : Object.assign({}, r, { external_id: id });
        if (ent === "contracts") { rec.customer_id = String(rec.customer_id); rec.service_id = String(rec.service_id); rec.status = rec.status || "vigente"; }
        if (ent === "usage_events") { rec.customer_id = String(rec.customer_id); if (rec.service_id != null) rec.service_id = String(rec.service_id); }
        if (ent === "emails") rec = Signals.email(r, dict, today);

        const merged = prev ? Object.assign({}, prev, rec) : rec; const mcmp = Object.assign({}, merged); delete mcmp._h;

  },
  apply(report, state, meta) {
    const changes = []; let created = 0, updated = 0, same = 0, errors = 0;
    for (const g of report) for (const r of g.rows) {
      if (r.status === "erro") { errors++; continue; }
      if (r.status === "igual") { same++; continue; }
      const prev = state[g.entity][r.id] ? JSON.parse(JSON.stringify(state[g.entity][r.id])) : null;
      if (prev && (g.entity === "customers" || g.entity === "contracts")) DB.history(r.rec, "importação", `Atualizado via ${meta.file}`);
      state[g.entity][r.id] = r.rec; changes.push({ e: g.entity, id: r.id, prev });
      prev ? updated++ : created++;
    }
    const h = { id: "imp-" + Date.now(), at: new Date().toISOString(), file: meta.file, role: meta.role, entities: report.map(g => `${ENTITY_LABEL[g.entity]}: ${g.rows.length}`).join(", "), created, updated, same, errors, changes, reverted: false };

  revert(state, id) {
    const h = state.imports.find(x => x.id === id); if (!h || h.reverted) return false;

    body: `<form id="frm" novalidate><div class="fgrid">${fields.map(x => fieldHtml(x, values[x.k])).join("")}</div><div class="ht-alert ht-alert--error" id="frmErr" role="alert" hidden style="margin-top:16px">${ic("error")}<div class="ht-alert__content"><p class="ht-alert__body"></p></div></div></form>`,
    foot: `<button type="button" class="ht-btn ht-btn--secondary" data-close>Cancelar</button><button type="submit" form="frm" class="ht-btn ht-btn--primary">${U.esc(saveLabel)}</button>`

/* Badges, status e indicadores */

const levelBadge = l => l === "alta" ? badge("Alta", "primary", { sm: true }) : l === "media" ? badge("Média", "warning", { sm: true }) : badge("Baixa", "neutral", { sm: true, outline: true });
const OPP_ST = { nova: ["Nova", "primary"], "em andamento": ["Em negociação", "warning"], ganha: ["Ganha", "success"], perdida: ["Perdida", "error"], descartada: ["Descartada", "neutral"] };

const ORIGIN = { email: ["mail", "E-mail"], renovacao: ["autorenew", "Renovação"], franquia: ["data_usage", "Franquia"], semcontrato: ["support_agent", "Chamados sem contrato"] };

function burn(s) {
  if (s.pct == null) return { label: "Sem franquia", tone: "neutral", color: "var(--slate-300)" };
  if (s.pct >= 1) return { label: "Excesso de franquia", tone: "error", color: "var(--color-error)" };
  if (s.pct >= .85) return { label: "Próximo do limite", tone: "warning", color: "#c77700" };
  if (s.pct < .3 && s.elapsed >= .5) return { label: "Baixo uso", tone: "warning", color: "#c77700" };
  return { label: "Dentro do previsto", tone: "success", color: "var(--color-primary)" };
}
function fbar(s, c, cap = true) {
  if (s.pct == null) return `<span class="muted small">Sem franquia de horas</span>`;
  const b = burn(s), p = Math.round(s.pct * 100), el = Math.round(Math.min(1, Math.max(0, s.elapsed)) * 100);
  return `<div class="fbar"><div class="fbar__track" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="Consumo da franquia: ${p}%"><div class="fbar__fill" style="width:${Math.min(100, p)}%;background:${b.color}"></div><div class="fbar__mark" style="left:${el}%" title="Vigência decorrida: ${el}%"></div></div>${cap ? `<div class="fbar__cap"><span><b>${U.num(s.used)} h</b> de ${U.num(c.hours, 0)} h · ${p}%</span><span>${el}% da vigência decorrida</span></div>` : ""}</div>`;
}

const kpi = ({ label, value, note, icon, tone = "brand", go }) => `<div class="ht-card kpi ${go ? "ht-card--interactive" : ""}" ${go ? `data-go="${go}" tabindex="0" role="link"` : ""}><div class="kpi__top"><span class="kpi__l">${U.esc(label)}</span>${icon ? `<span class="tile tile--${tone}">${ic(icon)}</span>` : ""}</div><div class="kpi__v">${value}</div>${note ? `<div class="kpi__n">${note}</div>` : ""}</div>`;
const pageHead = (title, sub, acts = "") => `<div class="ph"><div><h1 class="ht-h3">${U.esc(title)}</h1>${sub ? `<p class="muted">${sub}</p>` : ""}</div>${acts ? `<div class="ph__acts">${acts}</div>` : ""}</div>`;
const btn = (label, { id, icon, kind = "primary", sm, attrs = "" } = {}) => `<button type="button" class="ht-btn ht-btn--${kind}${sm ? " ht-btn--sm" : ""}" ${id ? `id="${id}"` : ""} ${attrs}>${icon ? ic(icon) : ""}${U.esc(label)}</button>`;
const iconBtn = (icon, label, attrs = "") => `<button type="button" class="ht-icon-btn ht-icon-btn--standard ht-icon-btn--sm" aria-label="${U.esc(label)}" title="${U.esc(label)}" ${attrs}>${ic(icon)}</button>`;
const tabs = (id, items, sel, pills) => `<div class="ht-tabs ${pills ? "ht-tabs--pills ht-tabs--sm" : ""}" data-tabs="${id}"><div class="ht-tabs__list" role="tablist">${items.map(([k, l, n]) => `<button type="button" class="ht-tab" role="tab" data-tab="${U.esc(k)}" aria-selected="${k === sel}">${U.esc(l)}${n != null ? `<span class="ht-tab__count">${n}</span>` : ""}</button>`).join("")}</div></div>`;
const selCtl = (attrs, opts, v, cls = "ctl-w180") => `<div class="ht-control ${cls}"><select class="ht-select ht-select--sm" ${attrs}>${opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${U.esc(ov)}" ${String(ov) === String(v ?? "") ? "selected" : ""}>${U.esc(ol)}</option>`; }).join("")}</select>${ic("expand_more", "ht-control__chev")}</div>`;
const searchCtl = (attrs, v, ph = "Buscar…", cls = "ctl-w220") => `<div class="ht-control ${cls}">${ic("search")}<input class="ht-input ht-input--sm ht-input--lead" type="search" placeholder="${U.esc(ph)}" aria-label="${U.esc(ph)}" value="${U.esc(v || "")}" ${attrs}></div>`;
const initials = n => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const mono = (n, xl) => `<span class="mono ${xl ? "mono--xl" : ""}" aria-hidden="true">${U.esc(initials(n))}</span>`;
const avatar = n => n ? `<span class="who"><span class="av" aria-hidden="true">${U.esc(initials(n))}</span>${U.esc(n)}</span>` : `<span class="muted">—</span>`;
const emptyState = (icon, title, text, act = "", neutral) => `<div class="empty-state"><span class="circ ${neutral ? "circ--neutral" : ""}">${ic(icon)}</span><b>${U.esc(title)}</b><p class="muted small">${text}</p>${act}</div>`;
const PT = {};
function health(c) {
  const today = Ctx.today(), cons = (Ctx.contractsIdx().get(c.external_id) || []).filter(k => M.isActive(k, today)), ev = Ctx.usageIdx().get(c.external_id) || [];
  let h = 100; if (c.status === "inadimplente") h -= 45; if (!cons.length) h -= 30;
  for (const k of cons) { const s = M.contractStatus(k, ev, today); if (s.pct != null && s.pct >= 1) h -= 15; if (s.flag === "baixo") h -= 20; if (U.days(today, k.end_date) <= 30 && !k.auto_renew) h -= 10; }
  h = Math.max(0, Math.min(100, h));
  return { v: h, label: h >= 75 ? "Saudável" : h >= 50 ? "Atenção" : "Em risco", tone: h >= 75 ? "success" : h >= 50 ? "warning" : "error", color: h >= 75 ? "var(--color-success)" : h >= 50 ? "#c77700" : "var(--color-error)" };
}
const healthHtml = c => { const h = health(c); return `<div class="score"><b>${h.v}</b><small style="color:${h.color}">${h.label}</small>${mini(h.v / 100, h.color)}</div>`; };

/* Tabela (card) com abas, busca, filtros, ordenação, paginação e exportação */
const TV = {};
function mountTable(el, id, cfg) {
  const st = TV[id] = TV[id] || { q: "", page: 0, sort: cfg.sort || null, dir: cfg.dir || 1, f: {}, tab: cfg.tabs?.def };
  if (PT[id] != null) { st.tab = PT[id]; delete PT[id]; st.page = 0; }
  const base = () => typeof cfg.rows === "function" ? cfg.rows() : cfg.rows;
  const rowsNow = () => {
    let rows = base(); const q = U.norm(st.q);
    if (cfg.tabs && st.tab != null) rows = rows.filter(r => cfg.tabs.test(r, st.tab));
    if (q) rows = rows.filter(r => cfg.cols.some(c => U.norm(c.val(r)).includes(q)));
    for (const f of cfg.filters || []) if (st.f[f.k]) rows = rows.filter(r => f.test(r, st.f[f.k]));
    if (st.sort) { const c = cfg.cols.find(c => c.k === st.sort); if (c) rows = rows.slice().sort((a, b) => { const x = c.sortVal ? c.sortVal(a) : c.val(a), y = c.sortVal ? c.sortVal(b) : c.val(b); return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "pt-BR")) * st.dir; }); }
    return rows;
  };
  const all = base();
  el.innerHTML = `<div class="tcard">${cfg.tabs ? `<div style="padding:4px 12px 0;border-bottom:1px solid var(--border-subtle)">${tabs(id, cfg.tabs.items.map(([k, l]) => [k, l, all.filter(r => cfg.tabs.test(r, k)).length]), st.tab)}</div>` : ""}
  <div class="tcard__bar">${searchCtl("data-q", st.q, cfg.searchPh || "Buscar…")}${(cfg.filters || []).map(f => selCtl(`data-f="${f.k}" aria-label="${U.esc(f.label)}"`, f.options.map(o => Array.isArray(o) ? o : [o, o]).map(([v, l], i) => [v, i === 0 && !v ? f.label + ": " + l : l]), st.f[f.k] || "", f.w || "ctl-w180")).join("")}<span class="sp"></span>
  ${cfg.exp === false ? "" : `<button type="button" class="ht-btn ht-btn--ghost ht-btn--sm" data-exp="csv">${ic("download")}CSV</button><button type="button" class="ht-btn ht-btn--ghost ht-btn--sm" data-exp="json">${ic("download")}JSON</button>`}</div><div data-area></div></div>`;
  const area = $("[data-area]", el);
  const draw = () => {
    const rows = rowsNow(), ps = cfg.pageSize || 10, pages = Math.max(1, Math.ceil(rows.length / ps)); st.page = Math.min(st.page, pages - 1);
    const slice = rows.slice(st.page * ps, st.page * ps + ps), ncol = cfg.cols.length + (cfg.actions ? 1 : 0) + (cfg.onRow ? 1 : 0);
    area.innerHTML = `<div class="tcard__scroll"><table class="ht-table ${cfg.onRow ? "ht-table--clickable" : ""}"><thead><tr>${cfg.cols.map(c => `<th scope="col" class="${c.num ? "ht-num" : ""}" aria-sort="${st.sort === c.k ? (st.dir > 0 ? "ascending" : "descending") : "none"}">${c.nosort ? U.esc(c.label) : `<button type="button" class="ht-table__sort" data-sort="${c.k}" data-active="${st.sort === c.k}">${U.esc(c.label)}${ic(st.sort === c.k ? (st.dir > 0 ? "arrow_upward" : "arrow_downward") : "unfold_more")}</button>`}</th>`).join("")}${cfg.actions ? `<th scope="col"><span class="sr">Ações</span></th>` : ""}${cfg.onRow ? `<th scope="col"><span class="sr">Abrir</span></th>` : ""}</tr></thead><tbody>` +
      (slice.length ? slice.map(r => `<tr ${cfg.onRow ? `data-row="${U.esc(cfg.rowId(r))}" tabindex="0"` : ""}>${cfg.cols.map(c => `<td class="${c.num ? "ht-num" : ""}">${c.html ? c.html(r) : U.esc(c.val(r))}</td>`).join("")}${cfg.actions ? `<td class="acts">${cfg.actions(r)}</td>` : ""}${cfg.onRow ? `<td class="chev">${ic("chevron_right")}</td>` : ""}</tr>`).join("") : `<tr><td colspan="${ncol}">${emptyState("search_off", cfg.empty || "Nenhum registro encontrado", "Ajuste a busca ou os filtros.", "", true)}</td></tr>`) +
      `</tbody></table></div><div class="tcard__foot"><span>${rows.length ? `Mostrando ${st.page * ps + 1}–${st.page * ps + slice.length} de ${rows.length}` : "0 registros"}</span><span class="sp"></span>${iconBtn("chevron_left", "Página anterior", `data-pg="-1" ${st.page === 0 ? "disabled" : ""}`)}<span>${st.page + 1} / ${pages}</span>${iconBtn("chevron_right", "Próxima página", `data-pg="1" ${st.page >= pages - 1 ? "disabled" : ""}`)}</div>`;
    $$("[data-sort]", area).forEach(b => b.onclick = () => { const k = b.dataset.sort; st.dir = st.sort === k ? -st.dir : 1; st.sort = k; draw(); });
    $$("[data-pg]", area).forEach(b => b.onclick = () => { st.page += +b.dataset.pg; draw(); });
    $$("[data-act]", area).forEach(b => b.onclick = ev => { ev.stopPropagation(); cfg.onAction(b.dataset.act, b.dataset.id); });
    if (cfg.onRow) $$("tr[data-row]", area).forEach(tr => { tr.onclick = () => cfg.onRow(tr.dataset.row); tr.onkeydown = e => { if (e.key === "Enter" && e.target === tr) cfg.onRow(tr.dataset.row); }; });
  };
  $("[data-q]", el).oninput = e => { st.q = e.target.value; st.page = 0; draw(); };
  $$("[data-f]", el).forEach(s => s.onchange = () => { st.f[s.dataset.f] = s.value; st.page = 0; draw(); });
  $$("[data-tabs] [data-tab]", el).forEach(b => b.onclick = () => { st.tab = b.dataset.tab; st.page = 0; $$("[data-tabs] [data-tab]", el).forEach(x => x.setAttribute("aria-selected", x === b)); draw(); });
  $$("[data-exp]", el).forEach(b => b.onclick = () => {
    const rows = rowsNow(), nm = `${id}-${U.today()}`;
    DB.audit("exportar", `${id} (${b.dataset.exp}, ${rows.length} registros)`); DB.save();
    if (b.dataset.exp === "csv") U.download(nm + ".csv", U.csv(rows, cfg.cols), "text/csv;charset=utf-8");
    else U.download(nm + ".json", JSON.stringify(rows.map(r => Object.fromEntries(cfg.cols.map(c => [c.label, c.val(r)]))), null, 2));
  });
  draw();
}

/* Gráficos (CSS/SVG, sem dependências) */
const nice = m => { if (m <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))), n = m / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };
const Charts = {
  columns(items, { avg = true, unit = "h" } = {}) {
    if (!items.length || items.every(i => !i.v)) return emptyState("bar_chart", "Sem consumo no período", "Não há eventos de uso registrados.", "", true);
    const max = nice(Math.max(...items.map(i => i.v))), a = U.sum(items, i => i.v) / items.length, y = v => v / max * 100;
    return `<div class="cchart" role="img" aria-label="Gráfico de colunas: ${items.map(i => `${i.l} ${U.num(i.v, 0)} ${unit}`).join(", ")}"><div class="cchart__y">${[0, .5, 1].map(f => `<span style="bottom:${f * 100}%">${U.num(max * f, 0)}</span>`).join("")}</div>
    <div class="cchart__plot">${[.5, 1].map(f => `<div class="cchart__grid" style="bottom:${f * 100}%"></div>`).join("")}${avg ? `<div class="cchart__avg" style="bottom:${y(a)}%"><span>média ${U.num(a, 0)} ${unit}</span></div>` : ""}
    ${items.map(i => `<div class="cchart__bar" style="height:${Math.max(1, y(i.v))}%" title="${U.esc(i.l)}: ${U.num(i.v)} ${unit}"><b>${U.num(i.v, 0)}</b></div>`).join("")}</div>
    <div class="cchart__x">${items.map(i => `<span>${U.esc(i.l)}</span>`).join("")}</div></div>`;
  },
  hbars(items, unit = "h") {
    if (!items.length) return emptyState("bar_chart", "Sem dados", "Nada a exibir no período.", "", true);
    const max = Math.max(...items.map(i => i.v), 1);
    return `<div class="hbars">${items.map(i => `<div class="hbar"><span class="ellip" title="${U.esc(i.l)}">${U.esc(i.l)}</span><div class="hbar__t"><i style="width:${i.v / max * 100}%"></i></div><span class="hbar__v">${U.num(i.v, 0)} ${unit}</span></div>`).join("")}</div>`;
  },
  lines(series, labels, w = 560, h = 200) {
    const all = series.flatMap(s => s.data), max = nice(Math.max(...all, 1)), n = Math.max(...series.map(s => s.data.length), 2), pl = 36, pt = 10, pb = 24;
    const x = i => pl + (w - pl - 8) * i / (n - 1), y = v => pt + (h - pt - pb) * (1 - v / max);
    const grid = [0, .5, 1].map(f => `<line x1="${pl}" x2="${w - 8}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--border-subtle)" ${f ? `stroke-dasharray="4 4"` : ""}/><text x="${pl - 6}" y="${y(max * f) + 4}" text-anchor="end">${U.num(max * f, 0)}</text>`).join("");
    const path = s => s.data.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    return `<svg class="lchart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de linhas: ${series.map(s => s.l).join(" × ")}">${grid}
    ${series[0] ? `<path d="${path(series[0])}L${x(series[0].data.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="var(--color-primary)" opacity=".07"/>` : ""}
    ${series.map(s => `<path d="${path(s)}" fill="none" stroke="${s.c}" stroke-width="${s.dash ? 2 : 2.5}" ${s.dash ? `stroke-dasharray="6 5"` : ""} stroke-linejoin="round" stroke-linecap="round"/>`).join("")}
    ${labels.map((l, i) => `<text x="${i ? w - 8 : pl}" y="${h - 6}" text-anchor="${i ? "end" : "start"}">${U.esc(l)}</text>`).join("")}</svg>
    <div class="legend">${series.map(s => `<span><i style="background:${s.c}"></i>${U.esc(s.l)}</span>`).join("")}</div>`;
  }
};
const monthsSeries = (usage, today, n = 6) => { const out = []; for (let i = n - 1; i >= 0; i--) { const d = U.d(today); d.setDate(1); d.setMonth(d.getMonth() - i); const k = U.iso(d).slice(0, 7); out.push({ l: d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", ""), v: U.sum(usage.filter(e => e.date.slice(0, 7) === k), e => +e.quantity || 0) }); } return out; };

- Comparações: use comparar_clientes (clientes específicos) ou ranking_clientes (carteira toda); apresente tabela markdown com as métricas lado a lado e um resumo com destaques e recomendações.
- Valores em R$ no formato brasileiro; datas dd/mm/aaaa; informe o período considerado. Não exponha CPF/CNPJ/contatos.`;
  },
  async _answer(q, history = [], onStep) {
    const msgs = [{ role: "system", content: this.sys() }, ...history.slice(-10).map(m => ({ role: m.r === "u" ? "user" : "assistant", content: m.raw ?? m.t })), { role: "user", content: q }], used = [];
    for (let i = 0; i < 6; i++) {
      const m = await AI.chat(msgs, { tools: AITools.defs });
      if (!m.tool_calls?.length) return { raw: m.content || "", html: AI.md(m.content || "(resposta vazia)"), tools: used };
      msgs.push({ role: "assistant", content: m.content || null, tool_calls: m.tool_calls });
      for (const tc of m.tool_calls) {
        let args = {}; try { args = JSON.parse(tc.function.arguments || "{}"); } catch (e) { }
        used.push({ name: tc.function.name, args }); onStep?.(used);
        msgs.push({ role: "tool", tool_call_id: tc.id, content: JSON.stringify(AITools.run(tc.function.name, tc.function.arguments)) });
      }
    }
    throw new Error("Limite de chamadas de ferramentas atingido.");
  }
};

  <article class="prose">
  <section data-p="use"><h2>Como usar</h2><p class="lead">O Portal CS reúne clientes, contratos, consumo e e-mails para apontar oportunidades com evidência real.</p><ol><li>Na primeira visita os <b>dados fictícios (mock)</b> são carregados automaticamente; para recarregá-los, use <b>Configurações → Dados</b>.</li><li>Navegue por Clientes, Contratos, Catálogo, Métricas e Oportunidades; o Assistente responde apenas com base nos dados carregados.</li><li>Os formatos de entrada (JSON Schema e exemplos) estão em <b>Schemas e exemplos</b> e na pasta <code>schemas/</code> do repositório.</li></ol>

  <section data-p="sig" hidden><h2>Sinais e pontuação</h2><p class="lead">Dicionário de sinais → serviço (editável em Configurações) e a fórmula de score.</p><div class="ht-table-wrap"><table class="ht-table ht-table--compact"><thead><tr><th>Regra</th><th>Serviço</th><th>Tipo</th><th>Termos</th></tr></thead><tbody>${Ctx.dict().rules.map(r => `<tr><td><b>${U.esc(r.key)}</b></td><td>${U.esc(Ctx.sname(String(r.service_id)))}</td><td>${badge(r.kind, "neutral", { sm: true })}</td><td class="small">${r.terms.map(U.esc).join(", ")}</td></tr>`).join("")}</tbody></table></div>
  <h4>Pontuação (0–100)</h4><ul><li><b>Evidência (0–30):</b> 10 por evidência distinta + bônus de recência (≤7 dias: +6; ≤15: +3).</li><li><b>Urgência (0–25):</b> e-mail: prazo/urgência +12, reclamação +6, concorrente +7; contrato: vencimento ≤7d 25, ≤15d 20, ≤30d 14, ≤60d 6; franquia: &gt;100% 25, ≥80% 12.</li><li><b>Aderência (0–25):</b> serviço ainda não contratado 25; upsell em serviço contratado 12.</li><li><b>Receita (0–20):</b> preço × unidades/ano do catálogo, proporcional a R$ 50 mil.</li><li><b>Nível:</b> Alta ≥70 · Média ≥45 · Baixa &lt;45.</li></ul>
  <h4>Origens de oportunidade</h4><p><b>email</b> (sinal no e-mail → serviço), <b>renovacao</b> (vence ≤60 dias sem renovação automática), <b>franquia</b> (consumo ≥80%), <b>semcontrato</b> (≥20 chamados sem contrato vigente).</p>
  <p>Guardrails: sem evidência não há oportunidade; e-mails internos/automáticos são ignorados; descartadas/perdidas só reaparecem com <i>nova evidência</i> posterior; nada é enviado nem alterado automaticamente.</p></section>
  <section data-p="lim" hidden><h2>Limitações e evolução</h2><p class="lead">O que esta fase não cobre e o caminho para produção.</p><h4>Limitações desta fase</h4><ul><li>Persistência em localStorage (~5 MB): suporta alguns milhares de registros; consumo/e-mails grandes exigem IndexedDB/backend.</li><li>Sem API, sem e-mail direto, perfis simulados (não é segurança real).</li><li>Análise por palavras-chave (sem compreensão semântica); catálogo de exemplo é fictício.</li><li>Franquia de horas é por vigência do contrato; sem rateio entre contratos simultâneos do mesmo cliente.</li></ul>

  on("aiTst", async () => { const c = aiRead(), err = aiValid(c), o = $("#aiOut"); if (err) return toast(err); o.textContent = "Testando…"; try { const r = await AI.complete([{ role: "user", content: "Responda apenas: OK" }], c); $("#aiOn").checked = true; o.textContent = "✔ Conexão OK. Resposta: " + r.slice(0, 120) + " — clique em Salvar para ativar no Assistente."; } catch (e) { o.textContent = "✘ Falha: " + (e.message || e) + (e instanceof TypeError ? " (verifique endpoint, rede e CORS)" : ""); } });

function toggleMask() { const s = DB.s.settings; s.mask = !s.mask; DB.audit(s.mask ? "mascarar_dados" : "revelar_dados", ""); DB.save(); applyRole(); go(current, { keep: true }); }
function lgpdAck() {
  const d = modal({ title: "Aviso de uso de dados (LGPD)", icon: "shield_person", desc: "Ambiente de homologação", body: `<p style="margin:0 0 12px">Os dados ficam <b>somente neste navegador</b> (localStorage) e não são enviados a nenhum servidor.</p><ul style="margin:0;padding-left:20px;display:grid;gap:6px"><li>Dados pessoais são <b>mascarados por padrão</b>.</li><li>E-mails são reduzidos a <b>resumo + referência</b> — o corpo não é guardado.</li><li>Ações são registradas em <b>auditoria</b>.</li></ul><p style="margin:12px 0 0" class="small muted">Use apenas dados anonimizados ou com base legal adequada.</p>`, foot: `<button type="button" class="ht-btn ht-btn--primary" id="ackB">${ic("check")}Entendi</button>` });
  $("#ackB").onclick = () => { DB.s.settings.ackLgpd = true; DB.save(); $("#dlg").close(); };
}
function init() {
  DB.load();
  $("#menuBtn").onclick = () => { const o = $("#drawer").classList.toggle("open"); $("#scrim").classList.toggle("on", o); $("#menuBtn").setAttribute("aria-expanded", o); };
  $("#scrim").onclick = closeNav;
  $("#crumbs").onclick = e => { const a = e.target.closest("[data-nav]"); if (a) go(a.dataset.nav); };
  $("#roleSel").onchange = e => { DB.s.settings.role = e.target.value; DB.audit("trocar_perfil", e.target.value); DB.save(); applyRole(); go(current); };
  $("#csSel").onchange = e => { DB.s.settings.cs = e.target.value; DB.audit("trocar_cs", e.target.value); DB.save(); applyRole(); go(current); };
  $("#maskBtn").onclick = toggleMask;
  $("#notifBtn").onclick = () => go("metrics");
  const gs = $("#gSearch"), find = () => { const v = gs.value.trim().toLowerCase(); if (!v) return; const c = Acc.customers().find(x => (x.trading_name || x.name).toLowerCase() === v) || Acc.customers().find(x => [x.trading_name, x.name, x.external_id].some(y => String(y || "").toLowerCase().includes(v))); if (c) { gs.value = ""; go("customers", { cust: String(c.external_id) }); } else toast("Nenhum cliente encontrado."); };
  gs.onchange = find; gs.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); find(); } };
  const act = e => {
    if (e.target.closest("[data-act]") && e.target.closest(".tcard")) return;
    const t = e.target.closest("[data-go],[data-opp],[data-cust],[data-load]"); if (!t || !$("#main").contains(t)) return;
    if (t.matches("input,select,textarea")) return; e.preventDefault();
    if (t.dataset.load !== undefined) return loadSample(), applyRole(), go(current, { keep: true }), toast("Dados de exemplo carregados.");
    if (t.dataset.opp) return openOpp(t.dataset.opp);
    if (t.dataset.cust) return go("customers", { cust: t.dataset.cust });
    if (t.dataset.gotab) { const [tid, tab] = t.dataset.gotab.split(":"); PT[tid] = tab; }
    go(t.dataset.go);
  };
  $("#main").addEventListener("click", act);
  $("#main").addEventListener("keydown", e => { if (e.key === "Enter" && !e.target.matches("button,a,input,select,textarea") && e.target.matches("[data-go],[data-opp],[data-cust],[data-load]")) act(e); });
  $("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#oppDrawer").hidden) closeOpp(); else if ($("#drawer").classList.contains("open")) closeNav(); } });
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (PAGE_META[h] && h !== current) go(h); });
  if (DB.s.settings.seeded !== 2) { DB.s.settings.seeded = 2; loadSample(); }
  applyRole(); const h = location.hash.slice(1); go(PAGE_META[h] ? h : "dashboard");
  if (!DB.s.settings.ackLgpd && !location.search.includes("selftest")) lgpdAck();
  if (location.search.includes("selftest")) { const r = SelfTest.run(); document.title = "SELFTEST " + r.filter(x => x.ok).length + "/" + r.length; console.log(r.filter(x => !x.ok)); }
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
